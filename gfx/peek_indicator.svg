<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Hand-pixelled 32x32 peek marker. The eye itself occupies 26x16 pixels. -->

  <!-- Stepped almond silhouette. -->
  <path fill="#02070a" d="M12 7h8v1h4v2h3v2h2v2h1v4h-1v2h-2v2h-3v2h-4v1h-8v-1H8v-2H5v-2H3v-2H2v-4h1v-2h2v-2h3V8h4z"/>
  <path fill="#0a3036" d="M12 9h8v1h4v2h3v2h1v4h-2v2h-3v2h-4v1h-7v-1H8v-2H5v-2H4v-4h2v-2h3v-2h3z"/>

  <!-- Sclera: pale, but shaded toward both corners and the lower lid. -->
  <path fill="#7f9896" d="M11 10h10v1h4v2h2v2h1v3h-2v2h-4v2H10v-1H7v-2H5v-4h1v-2h2v-2h3z"/>
  <path fill="#c3d3cd" d="M10 11h12v1h3v2h2v3h-2v2h-3v2H10v-1H7v-2H6v-3h1v-2h3z"/>
  <path fill="#ecf3e9" d="M9 12h14v1h2v2h1v2h-2v2h-3v1H10v-1H8v-2H7v-2h1v-2h1z"/>
  <path fill="#ffffff" d="M8 14h5v1h1v3h-2v1H9v-1H8z"/>

  <!-- Tear-duct and outer-corner shadows make it read as a real eye. -->
  <path fill="#244c50" d="M4 14h3v-2h3v2H8v1H7v3h1v1h2v2H7v-1H5v-2H4zm24 0h-3v-2h-3v2h2v1h1v3h-1v1h-2v2h3v-1h2v-2h1z"/>
  <rect fill="#36cfc9" x="5" y="16" width="2" height="2"/>
  <rect fill="#0a737b" x="25" y="16" width="2" height="2"/>

  <!-- Vertical iris, tucked under the upper eyelid. -->
  <path fill="#031316" d="M14 10h4v1h2v1h1v2h1v7h-1v2h-2v2h-6v-1h-2v-2h-1v-8h1v-2h1v-1h2z"/>
  <path fill="#07535b" d="M14 11h4v1h2v2h1v7h-2v2h-6v-1h-2v-2h-1v-5h1v-2h2v-1h1z"/>
  <path fill="#0ca9ac" d="M14 12h4v1h2v2h1v5h-2v2h-5v-1h-2v-2h-1v-4h1v-2h2z"/>
  <path fill="#52e1d7" d="M14 13h4v1h2v5h-1v2h-4v-1h-2v-6h1z"/>
  <path fill="#08717a" d="M12 19h2v2h2v1h3v-1h2v1h-2v2h-5v-1h-2z"/>

  <!-- Pupil is a vertical aperture rather than a circular target. -->
  <path fill="#010507" d="M15 12h3v1h1v2h1v5h-1v2h-4v-1h-1v-8h1z"/>
  <rect fill="#10272a" x="16" y="15" width="3" height="5"/>

  <!-- Small irregular reflections. -->
  <rect fill="#ffffff" x="13" y="12" width="2" height="2"/>
  <rect fill="#c9fff2" x="15" y="13" width="1" height="1"/>
  <rect fill="#ffffff" x="13" y="14" width="1" height="1"/>
  <rect fill="#72f5e7" x="18" y="18" width="1" height="2"/>

  <!-- Upper lid is heavier; lower lid is thin and broken into pixel clusters. -->
  <path fill="#0a737b" d="M12 8h8v1h4v2h3v2h2v2h-2v-1h-2v-2h-3v-1H10v1H7v2H5v1H3v-2h2v-2h3V9h4z"/>
  <path fill="#38d7d1" d="M12 9h8v1h4v2h2v1h-2v-1h-3v-1H11v1H8v1H6v1H5v-1h2v-2h3v-1h2z"/>
  <path fill="#07545c" d="M5 19h2v1h3v2h12v-1h3v-2h2v2h-3v2h-4v1h-8v-1H8v-2H5z"/>
  <path fill="#23bdbb" d="M8 21h3v1h10v-1h3v1h-3v2h-9v-1H8z"/>

  <!-- Dark corner lashes keep the icon visible over pale terrain. -->
  <rect fill="#02070a" x="2" y="15" width="3" height="2"/>
  <rect fill="#02070a" x="27" y="15" width="3" height="2"/>
</svg>
