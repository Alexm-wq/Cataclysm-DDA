name: Temporary split present patch

on:
  pull_request:
    branches:
      - mouse-inventory-0-i-test

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'tmp-single-split-guard-base2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'src/advanced_inv.cpp';
            const branch = 'mouse-inventory-0-i-test';
            const { data: file } = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            let s = Buffer.from(file.content, 'base64').toString('utf8');
            const oldText = `    } else if( action == "SPLIT_SELECTED" ) {\n        return action_split_stack( sitem, spane );\n`;
            const newText = `    } else if( action == "SPLIT_SELECTED" ) {\n        const bool split_exit = action_split_stack( sitem, spane );\n        // The split popup is destroyed inside action_split_stack(), which invalidates the\n        // inventory beneath it.  In Tiles, returning to the outer input loop before\n        // servicing that invalidation can present one frame with the popup gone and the\n        // workspace not yet restored.  Finish that UI-manager redraw in the same input\n        // dispatch so the final split state and status appear atomically.\n        if( ui ) {\n            ui_manager::redraw_invalidated();\n        }\n        return split_exit;\n`;
            if (!s.includes(oldText)) {
              core.setFailed('Could not locate SPLIT_SELECTED dispatch');
              return;
            }
            s = s.replace(oldText, newText);
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: 'Present split result before returning to input loop',
              sha: file.sha,
              content: Buffer.from(s, 'utf8').toString('base64')
            });
