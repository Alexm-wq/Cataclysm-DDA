name: Apply vehicle helper migration
on:
  push:
    branches: [mouse-inventory-0-i-test]
    paths:
      - '.github/workflows/apply-vehicle-helper-migration.py'
jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1
      - name: Apply guarded migration
        run: python .github/workflows/apply-vehicle-helper-migration.py
      - name: Validate source shape
        run: |
          git diff --check
          grep -q 'ui_action_strip editor_toolbar_strip' src/veh_interact.h
          grep -q 'ui_overlay refuel_overlay' src/veh_interact.h
          grep -q 'ui_double_click_tracker' src/veh_interact.cpp
          grep -q 'ui_scroll_model variant_scroll' src/veh_interact.cpp
          ! grep -q 'w_refuel_overlay;' src/veh_interact.h
          ! grep -q 'struct editor_toolbar_button' src/veh_interact.h
          ! grep -q 'struct editor_context_button' src/veh_interact.h
      - name: Commit migration
        run: |
          git config user.name 'Alexm-wq'
          git config user.email 'alexme.travel@gmail.com'
          rm -f .github/workflows/.migration* \
                .github/workflows/hold-migration.txt \
                .github/workflows/migration-prep-notes.txt \
                .github/workflows/migration-lock.txt \
                .github/workflows/migration-state.txt \
                .github/workflows/README.vehicle-helper-migration.tmp
          git rm -f .github/workflows/apply-vehicle-helper-migration.py \
                    .github/workflows/apply-vehicle-helper-migration.yml
          git add -A
          git commit -m 'Migrate vehicle editor to reusable UI helpers'
          git push origin HEAD:mouse-inventory-0-i-test
