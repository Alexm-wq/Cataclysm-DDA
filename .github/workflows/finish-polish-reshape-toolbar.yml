name: Finish reshape toolbar source patch
on:
  push:
    branches: [ mouse-inventory-0-i-test ]
    paths:
      - .github/workflows/finish-polish-reshape-toolbar.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1
      - name: Apply validated patch
        run: |
          python3 .github/workflows/repair-polish-reshape-toolbar.py
          python3 -m py_compile .github/workflows/polish-reshape-toolbar.py
          python3 .github/workflows/polish-reshape-toolbar.py
          git diff --check
      - name: Commit and push
        run: |
          git rm -f .github/workflows/polish-reshape-toolbar.py .github/workflows/polish-reshape-toolbar.yml
          git rm -f .github/workflows/repair-polish-reshape-toolbar.py .github/workflows/repair-polish-reshape-toolbar.yml
          git rm -f .github/workflows/finish-polish-reshape-toolbar.yml
          git config user.name "Alexm-wq"
          git config user.email "alexme.travel@gmail.com"
          git add src/veh_interact.cpp src/veh_interact.h src/sdltiles.cpp src/sdltiles.h src/cata_tiles.cpp src/cata_tiles.h
          git diff --cached --check
          git commit -m "Polish reshape choices and toolbar dropdowns"
          git push origin HEAD:mouse-inventory-0-i-test
