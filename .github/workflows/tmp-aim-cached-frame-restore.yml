name: Temporary AIM cached frame restore

on:
  push:
    branches:
      - mouse-inventory-0-i-test

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary AIM cached frame restore worker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'mouse-inventory-0-i-test';

            async function replaceOnce(path, oldText, newText, message) {
              const got = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              let text = Buffer.from(got.data.content, 'base64').toString('utf8');
              const count = text.split(oldText).length - 1;
              if (count !== 1) {
                core.setFailed(`${path}: expected one match, got ${count}`);
                return false;
              }
              text = text.replace(oldText, newText);
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch, message,
                sha: got.data.sha,
                content: Buffer.from(text, 'utf8').toString('base64')
              });
              return true;
            }

            const oldRedraw = `void catacurses::wredrawln( const window &/*win*/, int /*beg_line*/, int /*num_lines*/ )
{
    /**
     * This is a no-op for non-curses implementations. wincurse.cpp doesn't
     * use windows console for rendering, and sdltiles.cpp doesn't either.
     * If we had a console-based windows implementation, we'd need to do
     * something here to force the line to redraw.
     */
}`;
            const newRedraw = `void catacurses::wredrawln( const window &win_, int beg_line, int num_lines )
{
    cata_cursesport::WINDOW *const win = win_.get<cata_cursesport::WINDOW>();
    if( win == nullptr || num_lines <= 0 ) {
        return;
    }

    // SDL draws WINDOW contents into a persistent render target and clears the
    // touched/draw flags afterwards.  Marking cached lines dirty lets callers
    // restore an already-built window after a temporary overlay without erasing
    // or rebuilding its contents.
    const int first = beg_line < 0 ? 0 : beg_line;
    int last = beg_line + num_lines;
    if( last > win->height ) {
        last = win->height;
    }
    if( first >= last || first >= win->height ) {
        return;
    }
    for( int line = first; line < last; ++line ) {
        win->line[line].touched = true;
    }
    win->draw = true;
}`;
            if (!(await replaceOnce('src/cursesport.cpp', oldRedraw, newRedraw,
                                    'Make cached curses windows explicitly redrawable'))) {
              return;
            }

            const oldFrozen = `                wnoutrefresh( head );
                wnoutrefresh( mm_border );
                wnoutrefresh( minimap );
                wnoutrefresh( panes[left].window );
                wnoutrefresh( panes[right].window );
                return;`;
            const newFrozen = `                const auto restore_cached_window = []( const catacurses::window &window ) {
                    wredrawln( window, 0, getmaxy( window ) );
                    wnoutrefresh( window );
                };
                restore_cached_window( head );
                restore_cached_window( mm_border );
                restore_cached_window( minimap );
                restore_cached_window( panes[left].window );
                restore_cached_window( panes[right].window );
                inventory_modal_trace( "AIM redraw callback FROZEN cached windows force-restored" );
                return;`;
            await replaceOnce('src/advanced_inv.cpp', oldFrozen, newFrozen,
                              'Restore cached AIM frame during activity handoff');