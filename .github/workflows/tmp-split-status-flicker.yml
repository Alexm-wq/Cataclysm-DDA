name: Temporary split status flicker patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'tmp-split-status-flicker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-split-status-flicker
      - name: Apply patch
        shell: bash
        run: |
          python3 .github/tmp_split_status_patch.py
          git diff --check
          git config user.name "Inventory Fix Worker"
          git config user.email "inventory-fix@users.noreply.github.com"
          git add src/advanced_inv.cpp
          git commit -m "Paint final split status before redraw"
          git push origin HEAD:tmp-split-status-flicker
