name: Temporary AIM stack message consistency

on:
  push:
    branches:
      - mouse-inventory-0-i-test

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary AIM stack message consistency worker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'mouse-inventory-0-i-test';

            async function patchFile(path, message, transform) {
              const got = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              const original = Buffer.from(got.data.content, 'base64').toString('utf8');
              const updated = transform(original);
              if (updated === original) {
                core.setFailed(`${path}: transform made no changes`);
                return false;
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch, message,
                sha: got.data.sha,
                content: Buffer.from(updated, 'utf8').toString('base64')
              });
              return true;
            }

            function replaceOnce(text, oldText, newText, label) {
              const count = text.split(oldText).length - 1;
              if (count !== 1) {
                throw new Error(`${label}: expected one match, got ${count}`);
              }
              return text.replace(oldText, newText);
            }

            if (!(await patchFile('src/enums.h', 'Allow messages to coalesce for one user action', text => {
              const oldText = [
                'enum game_message_flags {',
                '    /* No specific game message flags */',
                '    gmf_none = 0,',
                '    /* Allow the message to bypass message cooldown. */',
                '    gmf_bypass_cooldown = 1,',
                '};'
              ].join('\n');
              const newText = [
                'enum game_message_flags {',
                '    /* No specific game message flags */',
                '    gmf_none = 0,',
                '    /* Allow the message to bypass message cooldown. */',
                '    gmf_bypass_cooldown = 1,',
                '    /* Allow identical messages from one user action to coalesce across multiple turns. */',
                '    gmf_coalesce_same_action = 1 << 1,',
                '};'
              ].join('\n');
              return replaceOnce(text, oldText, newText, 'game_message_flags');
            }))) return;

            if (!(await patchFile('src/messages.cpp', 'Coalesce repeated messages across one user action', text => {
              text = replaceOnce(text,
                '        bool coalesce_messages( const game_message &m ) {',
                '        bool coalesce_messages( const game_message &m, const game_message_flags flags ) {',
                'coalesce_messages signature');

              const oldGate = [
                '            auto &last_msg = messages.back();',
                '            if( last_msg.turn() + 3_turns < calendar::turn ) {',
                '                return false;',
                '            }'
              ].join('\n');
              const newGate = [
                '            auto &last_msg = messages.back();',
                '            const bool same_user_action =',
                '                last_msg.timestamp_in_user_actions == m.timestamp_in_user_actions;',
                '            if( last_msg.turn() + 3_turns < calendar::turn &&',
                '                ( ( flags & gmf_coalesce_same_action ) == 0 || !same_user_action ) ) {',
                '                return false;',
                '            }'
              ].join('\n');
              text = replaceOnce(text, oldGate, newGate, 'coalesce time gate');
              text = replaceOnce(text,
                '            if( coalesce_messages( m ) ) {',
                '            if( coalesce_messages( m, flags ) ) {',
                'coalesce call');
              return text;
            }))) return;

            if (!(await patchFile('src/activity_item_handling.cpp', 'Coalesce deliberate drop messages from one action', text => {
              const vehicleStart = [
                '    if( items.empty() ) {',
                '        return result;',
                '    }',
                '    c.invalidate_weight_carried_cache();'
              ].join('\n');
              const vehicleStartNew = [
                '    if( items.empty() ) {',
                '        return result;',
                '    }',
                '    const game_message_params deliberate_drop_message( m_neutral, gmf_coalesce_same_action );',
                '    c.invalidate_weight_carried_cache();'
              ].join('\n');
              text = replaceOnce(text, vehicleStart, vehicleStartNew, 'vehicle deliberate message params');

              const mapStart = [
                '    if( items.empty() ) {',
                '        return {};',
                '    }',
                '    const std::string ter_name = here->name( where );'
              ].join('\n');
              const mapStartNew = [
                '    if( items.empty() ) {',
                '        return {};',
                '    }',
                '    const game_message_params deliberate_drop_message( m_neutral, gmf_coalesce_same_action );',
                '    const std::string ter_name = here->name( where );'
              ].join('\n');
              text = replaceOnce(text, mapStart, mapStartNew, 'map deliberate message params');

              const deliberateCalls = [
                '                    c.add_msg_player_or_npc(\n                        n_gettext( "You put your %1$s in the %2$s\'s %3$s.",',
                '                    c.add_msg_player_or_npc(\n                        n_gettext( "You put some of your %1$s in the %2$s\'s %3$s.",',
                '                c.add_msg_player_or_npc(\n                    _( "You put several items in the %1$s\'s %2$s." ),',
                '                    you.add_msg_player_or_npc(\n                        n_gettext( "You drop your %1$s on the %2$s.",',
                '                    you.add_msg_player_or_npc(\n                        n_gettext( "You put your %1$s in the %2$s.",',
                '                    you.add_msg_player_or_npc(\n                        _( "You drop several items on the %s." ),',
                '                    you.add_msg_player_or_npc(\n                        _( "You put several items in the %s." ),'
              ];
              for (const needle of deliberateCalls) {
                const replacement = needle.replace('add_msg_player_or_npc(\n', 'add_msg_player_or_npc(\n                        deliberate_drop_message,\n');
                text = replaceOnce(text, needle, replacement, `deliberate drop message: ${needle.slice(0, 60)}`);
              }
              return text;
            }))) return;

            if (!(await patchFile('src/advanced_inv.cpp', 'Show AIM stack counts in workspace feedback', text => {
              const helperAnchor = [
                'const char *workspace_preset_name( const inventory_workspace_preset preset )',
                '{'
              ].join('\n');
              const helperPos = text.indexOf(helperAnchor);
              if (helperPos < 0) throw new Error('workspace helper anchor missing');
              const endNeedle = [
                '    return "unknown";',
                '}',
                '',
                'struct split_amount_button {'
              ].join('\n');
              const helperOld = endNeedle;
              const helperNew = [
                '    return "unknown";',
                '}',
                '',
                'std::string workspace_stack_label( const advanced_inv_listitem &entry )',
                '{',
                '    if( entry.items.empty() || !entry.items.front() ) {',
                '        return _( "item" );',
                '    }',
                '    const int stack_count = std::max( 1, entry.stacks );',
                '    const std::string name = entry.items.front()->tname();',
                '    return stack_count > 1 ?',
                '           string_format( _( "%1$s (x%2$d)" ), name, stack_count ) : name;',
                '}',
                '',
                'struct split_amount_button {'
              ].join('\n');
              text = replaceOnce(text, helperOld, helperNew, 'workspace stack label helper');

              text = replaceOnce(text,
                '                set_workspace_status( string_format( _( "Moving %s — release it over a container or the other pane." ),\n                                                     mouse_drag_item->tname() ) );',
                '                set_workspace_status( string_format( _( "Moving %s — release it over a container or the other pane." ),\n                                                     workspace_stack_label( batch.front() ) ) );',
                'single stack drag start');

              text = replaceOnce(text,
                '                        set_workspace_status( string_format( _( "Putting %1$s into %2$s…" ),\n                                                             dragged_item->tname(), drop_target->tname() ) );',
                '                        set_workspace_status( string_format( _( "Putting %1$s into %2$s…" ),\n                                                             workspace_stack_label( *dragged_entry ),\n                                                             drop_target->tname() ) );',
                'container drag release');

              text = replaceOnce(text,
                '            set_workspace_status( string_format( _( "Moving %1$s to %2$s…" ), dragged_item->tname(),\n                                                 squares[panes[dest].get_area()].name ) );',
                '            set_workspace_status( string_format( _( "Moving %1$s to %2$s…" ),\n                                                 dragged_entry != nullptr ?\n                                                 workspace_stack_label( *dragged_entry ) : dragged_item->tname(),\n                                                 squares[panes[dest].get_area()].name ) );',
                'pane drag release');

              text = replaceOnce(text,
                '                        string_format( _( "%1$s  →  %2$s" ), sitem->items.front()->tname(),\n                                       squares[panes[dest].get_area()].name ) );',
                '                        string_format( _( "%1$s  →  %2$s" ), workspace_stack_label( *sitem ),\n                                       squares[panes[dest].get_area()].name ) );',
                'workspace action strip');

              const ghostOld = [
                '    const std::string ghost_label = batch.size() > 1 ?',
                '                                    string_format( n_gettext( "[Moving %d item]", "[Moving %d items]",',
                '                                                   item_count ), item_count ) :',
                '                                    string_format( "[%s]", mouse_drag_item->tname() );'
              ].join('\n');
              const ghostNew = [
                '    const std::string ghost_label = batch.size() > 1 ?',
                '                                    string_format( n_gettext( "[Moving %d item]", "[Moving %d items]",',
                '                                                   item_count ), item_count ) :',
                '                                    string_format( "[%s]", batch.empty() ?',
                '                                                   mouse_drag_item->tname() :',
                '                                                   workspace_stack_label( batch.front() ) );'
              ].join('\n');
              text = replaceOnce(text, ghostOld, ghostNew, 'drag ghost label');
              return text;
            }))) return;