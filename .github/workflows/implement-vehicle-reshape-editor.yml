name: Implement vehicle reshape editor

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - .github/workflows/implement-vehicle-reshape-editor.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1

      - name: Apply direct-action and reshape patch
        run: |
          python3 -m py_compile .github/workflows/implement-vehicle-reshape-editor.py
          python3 .github/workflows/implement-vehicle-reshape-editor.py

      - name: Validate source structure
        run: |
          git diff --check
          grep -q 'struct veh_interact::reshape_info_t' src/veh_interact.cpp
          grep -q 'void veh_interact::display_reshape_pane()' src/veh_interact.cpp
          grep -q 'run_editor_context_action( here, "EDITOR_REMOVE" )' src/veh_interact.cpp
          grep -q 'add_entry( _( "Reshape…" ), "EDITOR_RESHAPE" )' src/veh_interact.cpp
          grep -q 'viewport_zoom = std::clamp( viewport_zoom - direction, 1, 4 )' src/veh_interact.cpp
          grep -q 'return point( 8, 4 );' src/veh_interact.cpp
          ! grep -A1 'action == "CHANGE_SHAPE"' src/veh_interact.cpp | grep -q "sel_cmd = 'p'"

      - name: Commit implementation and remove temporary helpers
        run: |
          git config user.name 'Alexm-wq'
          git config user.email 'alexme.travel@gmail.com'
          git rm -f .github/workflows/implement-vehicle-reshape-editor.py \
                    .github/workflows/implement-vehicle-reshape-editor.yml
          if [ -e .github/workflows/inspect-vehicle-editor-actions.yml ]; then
            git rm -f .github/workflows/inspect-vehicle-editor-actions.yml
          fi
          git add src/veh_interact.cpp src/veh_interact.h
          git commit -m 'Embed reshape mode in vehicle editor'
          git push origin HEAD:mouse-inventory-0-i-test
