name: Fix vehicle Back with dropdown

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - .github/workflows/fix-vehicle-back-dropdown.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1

      - name: Apply Back dropdown patch
        run: |
          python3 .github/workflows/fix-vehicle-back-dropdown.py

      - name: Validate
        run: |
          git diff --check
          grep -q 'Toolbar Back is an explicit navigation command' src/veh_interact.cpp
          grep -q 'click_selects_schematic' src/veh_interact.cpp
          grep -q 'click_selects_part' src/veh_interact.cpp

      - name: Commit and clean worker
        run: |
          git config user.name 'Alexm-wq'
          git config user.email 'alexme.travel@gmail.com'
          git rm .github/workflows/fix-vehicle-back-dropdown.py \
                 .github/workflows/fix-vehicle-back-dropdown.yml
          git add src/veh_interact.cpp
          git commit -m 'Make vehicle Back bypass open dropdowns'
          git push origin HEAD:mouse-inventory-0-i-test
