name: Finish reshape Live and Split support

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - .github/workflows/finish-reshape-live.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1

      - name: Patch reshape live rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/veh_interact.cpp')
          s = p.read_text()

          old = '''#if defined(TILES)\n    if( reshape_info || active_editor_view_mode == editor_view_mode::editor ) {\n        live_preview_last_draw_mode.reset();\n        clear_map_preview_window();\n        return;\n    }\n'''
          new = '''#if defined(TILES)\n    if( active_editor_view_mode == editor_view_mode::editor ) {\n        live_preview_last_draw_mode.reset();\n        clear_map_preview_window();\n        return;\n    }\n'''
          if s.count(old) != 1:
              raise SystemExit(f'live-preview reshape guard: expected 1 match, got {s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''    if( reshape_info ) {\n        mvwprintz( w_disp, point( 1, 0 ), c_light_gray,\n                   _( "Vehicle reshape  Mount (%+d,%+d)  Zoom %d%%" ),\n                   selected_mount().x(), selected_mount().y(), viewport_zoom * 50 );\n    } else if( active_editor_view_mode == editor_view_mode::split ) {\n'''
          new = '''    if( reshape_info && active_editor_view_mode == editor_view_mode::split ) {\n        mvwprintz( w_disp, point( 1, 0 ), c_light_gray,\n                   _( "Vehicle reshape  Mount (%+d,%+d)  Editor %d%% / Live %d%%" ),\n                   selected_mount().x(), selected_mount().y(), viewport_zoom * 50,\n                   live_preview_zoom * 50 );\n    } else if( reshape_info ) {\n        const int shown_zoom = active_editor_view_mode == editor_view_mode::live ?\n                               live_preview_zoom : viewport_zoom;\n        mvwprintz( w_disp, point( 1, 0 ), c_light_gray,\n                   _( "Vehicle reshape  Mount (%+d,%+d)  Zoom %d%%" ),\n                   selected_mount().x(), selected_mount().y(), shown_zoom * 50 );\n    } else if( active_editor_view_mode == editor_view_mode::split ) {\n'''
          if s.count(old) != 1:
              raise SystemExit(f'reshape zoom header: expected 1 match, got {s.count(old)}')
          s = s.replace(old, new, 1)

          # The normal schematic and reshape schematic deliberately share this
          # zoom route.  4 * 50% = 200%.
          zoom = 'viewport_zoom = std::clamp( viewport_zoom - direction, 1, 4 );'
          if zoom not in s:
              raise SystemExit('normal schematic 200% wheel zoom invariant missing')

          p.write_text(s)
          PY

      - name: Validate
        run: |
          git diff --check
          grep -q 'if( active_editor_view_mode == editor_view_mode::editor )' src/veh_interact.cpp
          ! grep -q 'reshape_info || active_editor_view_mode == editor_view_mode::editor' src/veh_interact.cpp
          grep -q 'Vehicle reshape  Mount (%+d,%+d)  Editor %d%% / Live %d%%' src/veh_interact.cpp
          grep -q 'viewport_zoom = std::clamp( viewport_zoom - direction, 1, 4 );' src/veh_interact.cpp
          grep -q 'Filter: reshapeable parts only' src/veh_interact.cpp
          grep -q 'set_vehicle_part_preview_tiles( w_msg, tile_previews )' src/veh_interact.cpp

      - name: Commit and push
        run: |
          git config user.name 'Alexm-wq'
          git config user.email 'alexme.travel@gmail.com'
          git rm -f .github/workflows/finish-reshape-live.yml
          git add src/veh_interact.cpp
          git commit -m 'Enable reshape Live and Split views'
          git push origin HEAD:mouse-inventory-0-i-test
