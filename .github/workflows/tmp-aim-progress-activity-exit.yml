name: Temporary AIM progress activity exit

on:
  push:
    branches:
      - mouse-inventory-0-i-test

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary AIM progress activity patch worker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'mouse-inventory-0-i-test';
            const path = 'src/advanced_inv.cpp';
            const got = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            let text = Buffer.from(got.data.content, 'base64').toString('utf8');

            const replacements = [
              [
                '        const bool started_activity = previous_activity != u.activity.id() || !ui;\n        log_workspace_event( string_format( "use result item=%s method=%s activity=%d",\n                                            item_id, method.empty() ? "default" : method,\n                                            static_cast<int>( started_activity ) ) );\n        if( started_activity ) {\n            do_return_entry();\n        }\n        return started_activity;',
                '        const bool started_activity = previous_activity != u.activity.id() || !ui;\n        const bool has_progress_ui = started_activity && u.activity &&\n                                     u.activity.get_progress_message( u ).has_value();\n        log_workspace_event( string_format( "use result item=%s method=%s activity=%d progress_ui=%d",\n                                            item_id, method.empty() ? "default" : method,\n                                            static_cast<int>( started_activity ),\n                                            static_cast<int>( has_progress_ui ) ) );\n        if( started_activity && !has_progress_ui ) {\n            // Menu-like/short activities deliberately have no base-game progress display.\n            // Keep AIM persistent for those just like other inventory-management handoffs.\n            do_return_entry();\n        } else if( has_progress_ui ) {\n            // Real gameplay activities (reading, crafting-style use actions, repairs, etc.)\n            // own the main game UI while they run.  Returning true closes AIM normally;\n            // without a re-entry marker create_advanced_inv() destroys the persistent\n            // workspace and the base-game activity/progress display takes over.\n            log_workspace_event( string_format( "use activity item=%s leaving AIM for base progress UI",\n                                                item_id ) );\n        }\n        return started_activity;',
                'use activity progress ownership'
              ],
              [
                '        const bool started_activity = previous_activity != u.activity.id() || !ui;\n        log_workspace_event( string_format( "relic use result item=%s activity=%d",\n                                            loc->typeId().str(),\n                                            static_cast<int>( started_activity ) ) );\n        if( started_activity ) {\n            do_return_entry();\n        }\n        return started_activity;',
                '        const bool started_activity = previous_activity != u.activity.id() || !ui;\n        const bool has_progress_ui = started_activity && u.activity &&\n                                     u.activity.get_progress_message( u ).has_value();\n        log_workspace_event( string_format( "relic use result item=%s activity=%d progress_ui=%d",\n                                            loc->typeId().str(),\n                                            static_cast<int>( started_activity ),\n                                            static_cast<int>( has_progress_ui ) ) );\n        if( started_activity && !has_progress_ui ) {\n            do_return_entry();\n        } else if( has_progress_ui ) {\n            log_workspace_event( string_format(\n                                     "relic activity item=%s leaving AIM for base progress UI",\n                                     loc->typeId().str() ) );\n        }\n        return started_activity;',
                'relic activity progress ownership'
              ]
            ];

            for (const [oldText, newText, label] of replacements) {
              const count = text.split(oldText).length - 1;
              if (count !== 1) {
                core.setFailed(`${label}: match count = ${count}`);
                return;
              }
              text = text.replace(oldText, newText);
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: 'Let base progress activities leave persistent inventory',
              sha: got.data.sha,
              content: Buffer.from(text, 'utf8').toString('base64')
            });
