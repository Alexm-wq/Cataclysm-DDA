name: Temporary AIM handoff flicker fix

on:
  push:
    branches:
      - mouse-inventory-0-i-test

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix temporary AIM handoff flicker worker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'mouse-inventory-0-i-test';
            const path = 'src/advanced_inv.cpp';

            const file = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            let text = Buffer.from(file.data.content, 'base64').toString('utf8');

            const countOf = (haystack, needle) => haystack.split(needle).length - 1;
            const replaceExact = (needle, replacement, expected, label) => {
              const count = countOf(text, needle);
              if (count !== expected) {
                core.setFailed(`${label}: expected ${expected} match(es), found ${count}`);
                return false;
              }
              text = text.replace(needle, replacement);
              return true;
            };

            const oldEntry = `    exit = false;\n` +
              `    activity_handoff = false;\n` +
              `    if( ui && save_state->exit_code == aim_exit::re_entry ) {\n` +
              `        // A frozen workspace reuses its existing ui_adaptor, so init() does\n` +
              `        // not run again to consume the re-entry marker.  Clear it here or a\n` +
              `        // later manual close leaves the adaptor registered, causing the\n` +
              `        // inventory to flash over subsequent map movement redraws.\n` +
              `        save_state->exit_code = aim_exit::none;\n` +
              `        log_workspace_event( \"resumed frozen workspace and cleared re-entry marker\" );\n` +
              `    }\n`;

            const newEntry = `    exit = false;\n` +
              `    bool first_frame_after_handoff = ui && save_state->exit_code == aim_exit::re_entry;\n` +
              `    if( first_frame_after_handoff ) {\n` +
              `        // The activity has already advanced the world and consumed its move cost.\n` +
              `        // Keep the cached AIM frame active until the first refreshed AIM frame is\n` +
              `        // ready, so re-entry never exposes a redraw of the world underneath it.\n` +
              `        save_state->exit_code = aim_exit::none;\n` +
              `        log_workspace_event( \"resumed frozen workspace and cleared re-entry marker\" );\n` +
              `    } else {\n` +
              `        activity_handoff = false;\n` +
              `    }\n`;

            const oldRedraw = `        if( ui ) {\n` +
              `            ui->invalidate_ui();\n` +
              `            if( recalc ) {\n` +
              `                g->invalidate_main_ui_adaptor();\n` +
              `            }\n` +
              `            ui_manager::redraw_invalidated();\n` +
              `        }\n`;

            const newRedraw = `        if( ui ) {\n` +
              `            // During an activity handoff the world has already been processed behind\n` +
              `            // the frozen inventory.  On the first AIM frame back, redraw AIM directly\n` +
              `            // over that frozen frame instead of invalidating the main/map adaptor first.\n` +
              `            // Subsequent redraws retain the normal main-UI invalidation behavior.\n` +
              `            if( first_frame_after_handoff ) {\n` +
              `                activity_handoff = false;\n` +
              `            }\n` +
              `            ui->invalidate_ui();\n` +
              `            if( recalc && !first_frame_after_handoff ) {\n` +
              `                g->invalidate_main_ui_adaptor();\n` +
              `            }\n` +
              `            ui_manager::redraw_invalidated();\n` +
              `            if( first_frame_after_handoff ) {\n` +
              `                first_frame_after_handoff = false;\n` +
              `                log_workspace_event( \"refreshed handoff frame without invalidating main UI\" );\n` +
              `            }\n` +
              `        }\n`;

            if (!replaceExact(oldEntry, newEntry, 1, 'handoff entry block')) return;
            if (!replaceExact(oldRedraw, newRedraw, 1, 'handoff redraw block')) return;

            for (const required of [
              'ghost_color = can_transfer ? h_green : h_red;',
              'validate_container_transfer( source_item, destination_container',
              'action_move_item_to_container( dragged_entry, source_pane, drop_target',
              'Moving %1$s to %2$s…'
            ]) {
              if (!text.includes(required)) {
                core.setFailed(`preserved inventory behavior missing: ${required}`);
                return;
              }
            }

            const updated = await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              sha: file.data.sha,
              message: 'Keep inventory frame stable across activity handoff',
              content: Buffer.from(text, 'utf8').toString('base64')
            });
            core.info(`created commit ${updated.data.commit.sha}`);
