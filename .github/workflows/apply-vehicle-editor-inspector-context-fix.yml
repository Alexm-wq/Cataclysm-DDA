name: Apply vehicle editor inspector context fix

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - '.github/workflows/apply-vehicle-editor-inspector-context-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test

      - name: Apply focused vehicle editor patch
        shell: bash
        run: |
          python3 -m py_compile .github/workflows/vehicle_editor_context_patch.py
          python3 .github/workflows/vehicle_editor_context_patch.py
          git diff --check
          grep -n "ghost_symbol = 0x25A1" src/veh_interact.cpp
          grep -n "editor_context_surface" src/veh_interact.cpp src/veh_interact.h

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/veh_interact.cpp src/veh_interact.h
          git rm .github/workflows/apply-vehicle-editor-inspector-context-fix.yml
          git rm .github/workflows/vehicle_editor_context_patch.py
          git commit -m "Fix vehicle editor inspector context actions"
          git push origin HEAD:mouse-inventory-0-i-test
