name: Add vehicle live camera diagnostics

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - .github/workflows/log-vehicle-live-camera.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1
          sparse-checkout: |
            src/veh_interact.cpp
            src/sdltiles.cpp
            .github/scripts/log_vehicle_live_camera.py
            .github/workflows/log-vehicle-live-camera.yml
          sparse-checkout-cone-mode: false

      - name: Apply diagnostics
        run: |
          python3 -m py_compile .github/scripts/log_vehicle_live_camera.py
          python3 .github/scripts/log_vehicle_live_camera.py

      - name: Sanity checks
        shell: bash
        run: |
          git diff --check
          grep -F '[VEH_LIVE_CAMERA] wheel-route action=' src/veh_interact.cpp
          grep -F '[VEH_LIVE_CAMERA] wheel-pre action=' src/veh_interact.cpp
          grep -F '[VEH_LIVE_CAMERA] wheel-post fraction=' src/veh_interact.cpp
          grep -F '[VEH_LIVE_CAMERA] mode-switch ' src/veh_interact.cpp
          grep -F '[VEH_LIVE_CAMERA] preview-register mode=' src/veh_interact.cpp
          grep -F '[VEH_LIVE_RENDER] draw center=' src/sdltiles.cpp
          grep -F 'const bool over_live_preview = viewport_pos && point_in_live_preview( *viewport_pos );' src/veh_interact.cpp

      - name: Commit diagnostics and clean helpers
        shell: bash
        run: |
          rm .github/scripts/log_vehicle_live_camera.py
          rm .github/workflows/log-vehicle-live-camera.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/veh_interact.cpp src/sdltiles.cpp .github/scripts/log_vehicle_live_camera.py .github/workflows/log-vehicle-live-camera.yml
          git commit -m 'Add vehicle live preview camera diagnostics'
          git push origin HEAD:mouse-inventory-0-i-test
