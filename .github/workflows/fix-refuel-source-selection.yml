name: Fix refuel source selection

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - .github/workflows/fix-refuel-source-selection.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1

      - name: Apply refuel selection patch
        run: |
          python3 -m py_compile .github/workflows/fix-refuel-source-selection.py
          python3 .github/workflows/fix-refuel-source-selection.py

      - name: Validate
        run: |
          git diff --check
          grep -q 'last_clicked_source_index' src/veh_interact.cpp
          grep -q 'Selected containers contain different fuel types and cannot be refueled together' src/veh_interact.cpp
          grep -q 'Refuel is a modal workflow and owns Escape' src/veh_interact.cpp

      - name: Commit and clean worker
        run: |
          git config user.name 'Alexm-wq'
          git config user.email 'alexme.travel@gmail.com'
          git rm .github/workflows/fix-refuel-source-selection.py \
                 .github/workflows/fix-refuel-source-selection.yml
          git add src/veh_interact.cpp
          git commit -m 'Fix refuel source multi-selection behavior'
          git push origin HEAD:mouse-inventory-0-i-test
