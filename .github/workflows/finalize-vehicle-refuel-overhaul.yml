# shallow finalizer trigger
name: Finalize vehicle refuel overhaul

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - .github/workflows/finalize-vehicle-refuel-overhaul.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1

      - name: Apply persistent refuel implementation
        run: |
          python3 .github/workflows/apply-vehicle-refuel-overhaul.py
          python3 .github/workflows/finalize-vehicle-refuel-overhaul.py

      - name: Validate implementation
        run: |
          git diff --check
          grep -q 'vehicle_refill_batch' src/veh_interact.cpp
          grep -q 'time_duration::from_turns' src/veh_interact.cpp
          grep -q 'std::optional<itype_id> chosen_fuel' src/veh_interact.cpp
          grep -q 'Quick refill all' src/veh_interact.cpp
          grep -q 'Fuel: %s' src/veh_interact.cpp
          grep -q 'approximately 96% complete' doc/UI_MODERNIZATION_STATUS/VEHICLE_EDITOR_OVERHAUL_STATUS.md
          grep -q 'remaining ~4%' doc/UI_MODERNIZATION_STATUS/VEHICLE_EDITOR_OVERHAUL_STATUS.md

      - name: Commit final implementation and remove patch scaffolding
        run: |
          git config user.name 'Alexm-wq'
          git config user.email 'alexme.travel@gmail.com'
          git rm .github/workflows/apply-vehicle-refuel-overhaul.py \
                 .github/workflows/apply-vehicle-refuel-overhaul.yml \
                 .github/workflows/finalize-vehicle-refuel-overhaul.py \
                 .github/workflows/finalize-vehicle-refuel-overhaul.yml
          git add src/veh_interact.cpp src/veh_interact.h doc/UI_MODERNIZATION_STATUS/VEHICLE_EDITOR_OVERHAUL_STATUS.md
          git commit -m 'Implement persistent vehicle refueling'
          git push origin mouse-inventory-0-i-test
