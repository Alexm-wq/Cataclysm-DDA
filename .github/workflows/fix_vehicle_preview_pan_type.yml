name: Fix vehicle preview pan coordinate

on:
  push:
    branches: [ mouse-inventory-0-i-test ]
    paths: [ '.github/workflows/fix_vehicle_preview_pan_type.yml' ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
      - name: Fix typed coordinate conversion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/veh_interact.cpp')
          s = p.read_text()
          old = 'vehicle_center + tripoint_rel_ms( live_preview_pan, 0 )'
          new = 'vehicle_center + tripoint_rel_ms( point_rel_ms( live_preview_pan ), 0 )'
          if s.count(old) != 1:
              raise SystemExit(f'expected one pan conversion, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/veh_interact.cpp
          git rm .github/workflows/fix_vehicle_preview_pan_type.yml
          git commit -m "Fix live preview pan coordinate type"
          git push origin HEAD:mouse-inventory-0-i-test
