name: Fix refuel target interaction v3

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - .github/workflows/fix-refuel-target-interaction-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1

      - name: Repair helper and apply refuel patch
        run: |
          python3 -m py_compile .github/workflows/fix-refuel-target-interaction-v3.py
          python3 .github/workflows/fix-refuel-target-interaction-v3.py
          python3 -m py_compile .github/workflows/fix-refuel-target-interaction.py
          python3 .github/workflows/fix-refuel-target-interaction.py

      - name: Validate
        run: |
          git diff --check
          grep -q 'refuel_targets_share_storage' src/veh_interact.cpp
          grep -q 'Double-click = continue' src/veh_interact.cpp
          grep -q 'Selected fuel stores use different fuel types and cannot be refueled together' src/veh_interact.cpp
          grep -q 'last_clicked_tank_index' src/veh_interact.cpp
          grep -q 'std::stable_sort( refuel_info->tanks.begin()' src/veh_interact.cpp

      - name: Commit and clean worker
        run: |
          git config user.name 'Alexm-wq'
          git config user.email 'alexme.travel@gmail.com'
          git rm .github/workflows/fix-refuel-target-interaction.py \
                 .github/workflows/fix-refuel-target-interaction.yml \
                 .github/workflows/fix-refuel-target-interaction-v2.py \
                 .github/workflows/fix-refuel-target-interaction-v2.yml \
                 .github/workflows/fix-refuel-target-interaction-v3.py \
                 .github/workflows/fix-refuel-target-interaction-v3.yml
          git add src/veh_interact.cpp
          git commit -m 'Fix refuel tank selection and grouping'
          git push origin HEAD:mouse-inventory-0-i-test
