name: Temporary split head flicker patch
on:
  pull_request:
    branches: [ mouse-inventory-0-i-test ]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'tmp-split-head-flicker'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-split-head-flicker
      - name: Apply patch
        shell: bash
        run: |
          python3 .github/tmp_split_head_patch.py
          git diff --check
          git config user.name "Inventory Fix Worker"
          git config user.email "inventory-fix@users.noreply.github.com"
          git add src/advanced_inv.cpp
          git commit -m "Stop split path from redrawing inventory header"
          git push origin HEAD:tmp-split-head-flicker
