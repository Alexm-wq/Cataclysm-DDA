name: Inspect vehicle live render hooks

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - '.github/workflows/inspect_vehicle_live_render.yml'

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
      - name: Inspect renderer hooks
        shell: bash
        run: |
          echo '=== tilecontext draw calls ==='
          grep -R -n -F 'tilecontext->draw(' src | head -80 || true
          echo '=== get_window_dimensions calls ==='
          grep -R -n -F 'get_window_dimensions(' src | head -120 || true
          echo '=== on_redraw tiles references ==='
          grep -R -n -E 'set_on_redraw|on_redraw' src/game*.cpp src/*ui*.cpp | head -120 || true
          echo '=== draw_ter references ==='
          grep -R -n -E 'draw_ter|draw_map|draw_terrain' src/game*.cpp src/*ui*.cpp | head -120 || true
