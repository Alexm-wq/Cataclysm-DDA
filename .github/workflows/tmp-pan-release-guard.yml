name: Temporary pan release guard

on:
  push:
    branches:
      - tmp-pan-release-guard-20260825

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch middle mouse pan state
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/tmp_pan_release_guard.py /tmp/patch.py
          git fetch --depth=1 origin mouse-inventory-0-i-test
          git checkout -B mouse-inventory-0-i-test FETCH_HEAD

          expected=6ef9077bf5452b1d79cbf631bb99bc7a7c9dc326
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "Refusing to patch moved target: expected $expected, got $actual" >&2
            exit 1
          fi

          python /tmp/patch.py
          git diff --check
          grep -q 'is_middle_mouse_button_down' src/sdl_utils.h
          grep -q 'camera_pan_active && !middle_mouse_down' src/game.cpp
          grep -q 'viewport_dragging && !middle_mouse_down' src/veh_interact.cpp
          grep -q 'MOUSE_MOVE.*!camera_pan_active.*middle_mouse_down' src/game.cpp
          grep -q 'MOUSE_MOVE.*!viewport_dragging.*middle_mouse_down' src/veh_interact.cpp

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sdl_utils.h src/game.cpp src/veh_interact.cpp
          git commit -m 'Harden middle mouse pan state'
          git push origin HEAD:mouse-inventory-0-i-test
