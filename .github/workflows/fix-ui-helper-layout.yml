name: Fix UI helper layout
on:
  push:
    branches: [ mouse-inventory-0-i-test ]
    paths:
      - .github/workflows/fix-ui-helper-layout.py
      - .github/workflows/fix-ui-helper-layout.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1
      - name: Apply patch
        run: python3 .github/workflows/fix-ui-helper-layout.py
      - name: Validate
        run: |
          git diff --check
          test -f src/ui_helpers/dropdown.h
          test ! -f src/ui_dropdown.h
          grep -n '#include "ui_helpers/dropdown.h"' src/veh_interact.h
          python3 - <<'PY'
          from pathlib import Path
          t = Path('src/ui_helpers/dropdown.h').read_text()
          block = t[t.index('struct ui_dropdown_entry'):t.index('struct ui_dropdown_style')]
          assert block.index('std::string disabled_reason;') < block.index('std::optional<bool> checked;')
          assert 'class ui_multiselect_filter' in t
          assert 'std::optional<bool> checked;' in t
          PY
      - name: Commit and push
        run: |
          git rm -f .github/workflows/fix-ui-helper-layout.py .github/workflows/fix-ui-helper-layout.yml
          git config user.name "Alexm-wq"
          git config user.email "alexme.travel@gmail.com"
          git add src/ui_helpers/dropdown.h src/veh_interact.h
          git add -u src/ui_dropdown.h
          git diff --cached --check
          git commit -m "Organize UI helpers and fix dropdown aggregates"
          git push origin HEAD:mouse-inventory-0-i-test
