name: Repair scrollbar extraction fast
on:
  push:
    branches: [ mouse-inventory-0-i-test ]
    paths:
      - .github/workflows/repair-scrollbar-fast.py
      - .github/workflows/repair-scrollbar-fast.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1
      - name: Repair extraction
        run: python3 .github/workflows/repair-scrollbar-fast.py
      - name: Validate
        run: |
          git diff --check
          grep -n 'scrollbar::scrollbar()' src/ui_helpers/primitive/scrollbar.cpp
          grep -n 'void multiline_list::activate_entry' src/output.cpp
          ! grep -n 'void multiline_list::activate_entry' src/ui_helpers/primitive/scrollbar.cpp
          ! grep -n 'scrollbar::scrollbar()' src/output.cpp
          grep -n '#include "cata_utility.h"' src/ui_helpers/primitive/scrollbar.cpp
      - name: Commit and push
        run: |
          git rm -f \
            .github/workflows/repair-scrollbar-fast.py \
            .github/workflows/repair-scrollbar-fast.yml \
            .github/workflows/repair-scrollbar-extraction.py \
            .github/workflows/repair-scrollbar-extraction.yml
          git config user.name "Alexm-wq"
          git config user.email "alexme.travel@gmail.com"
          git add src/output.cpp src/ui_helpers/primitive/scrollbar.cpp
          git diff --cached --check
          git commit -m "Repair scrollbar helper extraction"
          git push origin HEAD:mouse-inventory-0-i-test
