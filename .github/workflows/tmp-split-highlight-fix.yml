name: Temporary split/highlight patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-split-highlight-fix
      - name: Apply patch
        shell: bash
        run: |
          python3 .github/tmp_patch_split_highlight.py
          git diff --check
          if git diff --quiet -- src/advanced_inv.cpp; then
            exit 0
          fi
          git config user.name "Inventory Fix Worker"
          git config user.email "inventory-fix@users.noreply.github.com"
          git add src/advanced_inv.cpp
          git commit -m "Fix split flicker and preserve stacked selection"
          git push origin HEAD:tmp-split-highlight-fix
