name: Temporary split status API patch

on:
  pull_request:
    branches:
      - mouse-inventory-0-i-test

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'tmp-split-status-race'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'src/advanced_inv.cpp';
            const branch = 'tmp-split-status-race';
            const { data: file } = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            let s = Buffer.from(file.content, 'base64').toString('utf8');
            const func = s.indexOf('void advanced_inventory::redraw_action_strip()');
            if (func < 0) {
              core.setFailed('Could not locate redraw_action_strip');
              return;
            }
            const nextFunc = s.indexOf('\nvoid advanced_inventory::close_context_menu()', func);
            if (nextFunc < 0) {
              core.setFailed('Could not locate end of redraw_action_strip');
              return;
            }
            const startNeedle = '    std::string status = workspace_status;\n    nc_color status_color = c_light_blue;\n';
            const start = s.indexOf(startNeedle, func);
            if (start >= 0 && start < nextFunc) {
              const endNeedle = '    trim_and_print( head, point( 2, 2 ), right_edge - 2, status_color, status );\n';
              const end = s.indexOf(endNeedle, start);
              if (end < 0 || end >= nextFunc) {
                core.setFailed('Could not locate status override end');
                return;
              }
              const replacement = '    const std::string &status = workspace_status;\n    const nc_color status_color = c_light_blue;\n';
              s = s.slice(0, start) + replacement + s.slice(end);
            }
            const func2 = s.indexOf('void advanced_inventory::redraw_action_strip()');
            const nextFunc2 = s.indexOf('\nvoid advanced_inventory::close_context_menu()', func2);
            const avatarLine = '    avatar &u = get_avatar();\n';
            const avatarPos = s.indexOf(avatarLine, func2);
            if (avatarPos >= 0 && avatarPos < nextFunc2) {
              s = s.slice(0, avatarPos) + s.slice(avatarPos + avatarLine.length);
            }
            const original = Buffer.from(file.content, 'base64').toString('utf8');
            if (s === original) {
              core.info('Already patched');
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: 'Remove stale status redraw dependency',
              sha: file.sha,
              content: Buffer.from(s, 'utf8').toString('base64')
            });
