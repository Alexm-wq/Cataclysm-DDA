name: Temporary split status race patch

on:
  pull_request:
    branches:
      - mouse-inventory-0-i-test

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'tmp-split-status-race'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-split-status-race
          fetch-depth: 0
      - name: Apply status patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/advanced_inv.cpp')
          s = p.read_text()
          start = s.index('    std::string status = workspace_status;\n    nc_color status_color = c_light_blue;\n', s.index('void advanced_inventory::redraw_action_strip()'))
          end_marker = '    trim_and_print( head, point( 2, 2 ), right_edge - 2, status_color, status );\n'
          end = s.index(end_marker, start)
          replacement = '    const std::string &status = workspace_status;\n    const nc_color status_color = c_light_blue;\n'
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
          git diff --check
          git config user.name "Inventory Fix Worker"
          git config user.email "inventory-fix@users.noreply.github.com"
          git add src/advanced_inv.cpp
          git commit -m "Keep inventory status messages stable"
          git push origin HEAD:tmp-split-status-race
