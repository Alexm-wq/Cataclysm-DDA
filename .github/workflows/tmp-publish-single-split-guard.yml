name: Temporary publish single split guard

on:
  pull_request:
    branches:
      - mouse-inventory-0-i-test

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'tmp-single-split-guard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'src/advanced_inv.cpp';
            const sourceBranch = 'tmp-single-split-guard';
            const targetBranch = 'mouse-inventory-0-i-test';
            const { data: source } = await github.rest.repos.getContent({ owner, repo, path, ref: sourceBranch });
            const { data: target } = await github.rest.repos.getContent({ owner, repo, path, ref: targetBranch });
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: targetBranch,
              message: 'Stabilize split and drag redraw behavior',
              sha: target.sha,
              content: source.content.replace(/\s/g, '')
            });
