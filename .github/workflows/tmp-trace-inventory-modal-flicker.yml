name: Temporary inventory modal trace

on:
  push:
    branches:
      - mouse-inventory-0-i-test

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix temporary inventory modal trace worker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'mouse-inventory-0-i-test';
            const path = 'src/advanced_inv.cpp';
            const file = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            let text = Buffer.from(file.data.content, 'base64').toString('utf8');
            const countOf = (needle) => text.split(needle).length - 1;
            const r = (oldText, newText, label) => {
              const count = countOf(oldText);
              if (count !== 1) {
                core.setFailed(`${label}: expected 1 match, found ${count}`);
                return false;
              }
              text = text.replace(oldText, newText);
              return true;
            };

            const globalsOld = 'namespace\n{\nstd::unique_ptr<advanced_inventory> advinv;\n';
            const globalsNew = 'namespace\n{\nstd::unique_ptr<advanced_inventory> advinv;\n' +
              'bool inventory_modal_trace_active = false;\n' +
              'int inventory_modal_trace_sequence = 0;\n' +
              'std::string inventory_modal_trace_tag;\n\n' +
              'void inventory_modal_trace( const std::string &event )\n{\n' +
              '    if( inventory_modal_trace_active && get_option<bool>( "INVENTORY_WORKSPACE_DEBUG_LOG" ) ) {\n' +
              '        DebugLog( D_INFO, DC_ALL ) << "[inventory_workspace_trace " << inventory_modal_trace_tag << "] " << event;\n' +
              '    }\n}\n\n' +
              'void begin_inventory_modal_trace( const std::string &kind, const std::string &item )\n{\n' +
              '    ++inventory_modal_trace_sequence;\n' +
              '    inventory_modal_trace_tag = string_format( "%s#%d", kind, inventory_modal_trace_sequence );\n' +
              '    inventory_modal_trace_active = true;\n' +
              '    inventory_modal_trace( string_format( "BEGIN item=%s moves=%d exit_code=%d", item, get_avatar().get_moves(), static_cast<int>( uistate.transfer_save.exit_code ) ) );\n' +
              '}\n\n' +
              'void end_inventory_modal_trace( const std::string &reason )\n{\n' +
              '    inventory_modal_trace( string_format( "END reason=%s", reason ) );\n' +
              '    inventory_modal_trace_active = false;\n' +
              '    inventory_modal_trace_tag.clear();\n' +
              '}\n';
            if (!r(globalsOld, globalsNew, 'trace globals')) return;

            const splitUiOld = '    ui_adaptor split_ui;\n    split_ui.position_from_window( dialog );\n    split_ui.on_redraw( [&]( const ui_adaptor & ) {\n';
            const splitUiNew = '    begin_inventory_modal_trace( "split", item_name );\n' +
              '    inventory_modal_trace( string_format( "split modal constructing available=%d maximum=%d", available, maximum ) );\n' +
              '    on_out_of_scope split_trace_after_ui( [&]() {\n' +
              '        inventory_modal_trace( string_format( "split modal adaptor destroyed canceled=%d confirmed=%d", static_cast<int>( modal_canceled ), static_cast<int>( modal_confirmed ) ) );\n' +
              '        if( modal_canceled ) {\n' +
              '            end_inventory_modal_trace( "split canceled after adaptor destruction" );\n' +
              '        }\n' +
              '    } );\n' +
              '    ui_adaptor split_ui;\n' +
              '    inventory_modal_trace( "split modal adaptor constructed" );\n' +
              '    split_ui.position_from_window( dialog );\n' +
              '    split_ui.on_redraw( [&]( const ui_adaptor & ) {\n' +
              '        inventory_modal_trace( string_format( "split modal redraw confirmed=%d canceled=%d", static_cast<int>( modal_confirmed ), static_cast<int>( modal_canceled ) ) );\n';
            if (!r(splitUiOld, splitUiNew, 'split adaptor trace')) return;

            const splitLoopOld = '    while( !modal_confirmed && !modal_canceled ) {\n        split_ui.invalidate_ui();\n        ui_manager::redraw_invalidated();\n        amount_input.query_string( false );\n';
            const splitLoopNew = '    while( !modal_confirmed && !modal_canceled ) {\n' +
              '        inventory_modal_trace( "split loop invalidate modal" );\n' +
              '        split_ui.invalidate_ui();\n' +
              '        inventory_modal_trace( "split loop calling redraw_invalidated" );\n' +
              '        ui_manager::redraw_invalidated();\n' +
              '        inventory_modal_trace( "split loop redraw_invalidated returned; entering input" );\n' +
              '        amount_input.query_string( false );\n' +
              '        inventory_modal_trace( string_format( "split input returned popup_confirmed=%d popup_canceled=%d modal_confirmed=%d modal_canceled=%d", static_cast<int>( amount_input.confirmed() ), static_cast<int>( amount_input.canceled() ), static_cast<int>( modal_confirmed ), static_cast<int>( modal_canceled ) ) );\n';
            if (!r(splitLoopOld, splitLoopNew, 'split loop trace')) return;

            const splitExitOld = '    if( modal_canceled ) {\n        return std::nullopt;\n    }\n    return selected_amount;\n';
            const splitExitNew = '    inventory_modal_trace( string_format( "split loop exit confirmed=%d canceled=%d selected=%d", static_cast<int>( modal_confirmed ), static_cast<int>( modal_canceled ), selected_amount.value_or( 0 ) ) );\n' + splitExitOld;
            if (!r(splitExitOld, splitExitNew, 'split exit trace')) return;

            const quantityUiOld = '            ui_adaptor quantity_ui;\n            quantity_ui.position_from_window( quantity_window );\n            quantity_ui.on_redraw( [&]( const ui_adaptor & ) {\n';
            const quantityUiNew = '            begin_inventory_modal_trace( "move", it.typeId().str() );\n' +
              '            inventory_modal_trace( string_format( "move modal constructing available=%d maximum=%d input_amount=%d", count, possible_max, input_amount ) );\n' +
              '            on_out_of_scope quantity_trace_after_ui( [&]() {\n' +
              '                inventory_modal_trace( string_format( "move modal adaptor destroyed canceled=%d confirmed=%d amount=%d", static_cast<int>( modal_canceled ), static_cast<int>( modal_confirmed ), amount ) );\n' +
              '                if( modal_canceled || amount <= 0 ) {\n' +
              '                    end_inventory_modal_trace( "move canceled after adaptor destruction" );\n' +
              '                }\n' +
              '            } );\n' +
              '            ui_adaptor quantity_ui;\n' +
              '            inventory_modal_trace( "move modal adaptor constructed" );\n' +
              '            quantity_ui.position_from_window( quantity_window );\n' +
              '            quantity_ui.on_redraw( [&]( const ui_adaptor & ) {\n' +
              '                inventory_modal_trace( string_format( "move modal redraw confirmed=%d canceled=%d", static_cast<int>( modal_confirmed ), static_cast<int>( modal_canceled ) ) );\n';
            if (!r(quantityUiOld, quantityUiNew, 'move adaptor trace')) return;

            const quantityLoopOld = '            while( !modal_confirmed && !modal_canceled ) {\n                quantity_ui.invalidate_ui();\n                ui_manager::redraw_invalidated();\n                amount_input.query_string( false );\n';
            const quantityLoopNew = '            while( !modal_confirmed && !modal_canceled ) {\n' +
              '                inventory_modal_trace( "move loop invalidate modal" );\n' +
              '                quantity_ui.invalidate_ui();\n' +
              '                inventory_modal_trace( "move loop calling redraw_invalidated" );\n' +
              '                ui_manager::redraw_invalidated();\n' +
              '                inventory_modal_trace( "move loop redraw_invalidated returned; entering input" );\n' +
              '                amount_input.query_string( false );\n' +
              '                inventory_modal_trace( string_format( "move input returned popup_confirmed=%d popup_canceled=%d modal_confirmed=%d modal_canceled=%d", static_cast<int>( amount_input.confirmed() ), static_cast<int>( amount_input.canceled() ), static_cast<int>( modal_confirmed ), static_cast<int>( modal_canceled ) ) );\n';
            if (!r(quantityLoopOld, quantityLoopNew, 'move loop trace')) return;

            const quantityResultOld = '            amount = modal_canceled ? 0 : selected_amount.value_or( 0 );\n            log_workspace_event( string_format( "quantity requested=%d maximum=%d item=%s", amount,\n                                                possible_max, it.typeId().str() ) );\n';
            const quantityResultNew = '            amount = modal_canceled ? 0 : selected_amount.value_or( 0 );\n' +
              '            inventory_modal_trace( string_format( "move loop exit confirmed=%d canceled=%d selected=%d", static_cast<int>( modal_confirmed ), static_cast<int>( modal_canceled ), amount ) );\n' +
              '            log_workspace_event( string_format( "quantity requested=%d maximum=%d item=%s", amount,\n                                                possible_max, it.typeId().str() ) );\n';
            if (!r(quantityResultOld, quantityResultNew, 'move result trace')) return;

            const handoffOld = '    activity_handoff = ui != nullptr;\n    uistate.open_menu = []() {\n';
            const handoffNew = '    activity_handoff = ui != nullptr;\n' +
              '    inventory_modal_trace( string_format( "do_return_entry armed handoff=%d moves=%d recalc=%d left_recalc=%d right_recalc=%d", static_cast<int>( activity_handoff ), get_avatar().get_moves(), static_cast<int>( recalc ), static_cast<int>( panes[left].recalc ), static_cast<int>( panes[right].recalc ) ) );\n' +
              '    uistate.open_menu = []() {\n';
            if (!r(handoffOld, handoffNew, 'handoff trace')) return;

            const displayOld = '    input_context ctxt{ register_ctxt() };\n\n    exit = false;\n    bool first_frame_after_handoff = ui && save_state->exit_code == aim_exit::re_entry;\n';
            const displayNew = '    input_context ctxt{ register_ctxt() };\n\n' +
              '    inventory_modal_trace( string_format( "display enter ui=%d moves=%d exit_code=%d handoff=%d recalc=%d left_recalc=%d right_recalc=%d", static_cast<int>( ui != nullptr ), player_character.get_moves(), static_cast<int>( save_state->exit_code ), static_cast<int>( activity_handoff ), static_cast<int>( recalc ), static_cast<int>( panes[left].recalc ), static_cast<int>( panes[right].recalc ) ) );\n' +
              '    exit = false;\n' +
              '    bool first_frame_after_handoff = ui && save_state->exit_code == aim_exit::re_entry;\n' +
              '    inventory_modal_trace( string_format( "display first_frame_after_handoff=%d", static_cast<int>( first_frame_after_handoff ) ) );\n';
            if (!r(displayOld, displayNew, 'display entry trace')) return;

            const cbOld = '        ui->on_redraw( [&]( const ui_adaptor & ) {\n            if( activity_handoff ) {\n';
            const cbNew = '        ui->on_redraw( [&]( const ui_adaptor & ) {\n' +
              '            inventory_modal_trace( string_format( "AIM redraw callback ENTER handoff=%d recalc=%d left_recalc=%d right_recalc=%d moves=%d", static_cast<int>( activity_handoff ), static_cast<int>( recalc ), static_cast<int>( panes[left].recalc ), static_cast<int>( panes[right].recalc ), player_character.get_moves() ) );\n' +
              '            if( activity_handoff ) {\n' +
              '                inventory_modal_trace( "AIM redraw callback FROZEN cached-window refresh only" );\n';
            if (!r(cbOld, cbNew, 'AIM callback trace')) return;

            const panesOld = '            redraw_pane( advanced_inventory::side::left );\n            redraw_pane( advanced_inventory::side::right );\n';
            const panesNew = '            inventory_modal_trace( "AIM redraw callback FULL before redraw_pane" );\n' + panesOld +
              '            inventory_modal_trace( "AIM redraw callback FULL after redraw_pane" );\n';
            if (!r(panesOld, panesNew, 'pane redraw trace')) return;

            const loopOld = '    while( !exit ) {\n        if( player_character.get_moves() < 0 ) {\n            do_return_entry();\n            return;\n        }\n\n        if( ui ) {\n';
            const loopNew = '    while( !exit ) {\n' +
              '        inventory_modal_trace( string_format( "display loop top moves=%d first_frame=%d handoff=%d recalc=%d", player_character.get_moves(), static_cast<int>( first_frame_after_handoff ), static_cast<int>( activity_handoff ), static_cast<int>( recalc ) ) );\n' +
              '        if( player_character.get_moves() < 0 ) {\n' +
              '            inventory_modal_trace( "display loop NEGATIVE MOVES: re-handoff before AIM redraw" );\n' +
              '            do_return_entry();\n' +
              '            return;\n' +
              '        }\n\n        if( ui ) {\n';
            if (!r(loopOld, loopNew, 'display loop trace')) return;

            const presentOld = '            if( first_frame_after_handoff ) {\n                activity_handoff = false;\n            }\n            ui->invalidate_ui();\n            if( recalc && !first_frame_after_handoff ) {\n                g->invalidate_main_ui_adaptor();\n            }\n            ui_manager::redraw_invalidated();\n            if( first_frame_after_handoff ) {\n                first_frame_after_handoff = false;\n                log_workspace_event( "refreshed handoff frame without invalidating main UI" );\n            }\n';
            const presentNew = '            if( first_frame_after_handoff ) {\n' +
              '                inventory_modal_trace( "display present releasing frozen handoff" );\n' +
              '                activity_handoff = false;\n' +
              '            }\n' +
              '            inventory_modal_trace( "display present invalidating AIM adaptor" );\n' +
              '            ui->invalidate_ui();\n' +
              '            if( recalc && !first_frame_after_handoff ) {\n' +
              '                inventory_modal_trace( "display present invalidating MAIN/world adaptor" );\n' +
              '                g->invalidate_main_ui_adaptor();\n' +
              '            } else {\n' +
              '                inventory_modal_trace( string_format( "display present MAIN/world invalidation skipped recalc=%d first_frame=%d", static_cast<int>( recalc ), static_cast<int>( first_frame_after_handoff ) ) );\n' +
              '            }\n' +
              '            inventory_modal_trace( "display present calling redraw_invalidated" );\n' +
              '            ui_manager::redraw_invalidated();\n' +
              '            inventory_modal_trace( "display present redraw_invalidated returned" );\n' +
              '            if( first_frame_after_handoff ) {\n' +
              '                first_frame_after_handoff = false;\n' +
              '                log_workspace_event( "refreshed handoff frame without invalidating main UI" );\n' +
              '                end_inventory_modal_trace( "first refreshed AIM frame after handoff completed" );\n' +
              '            }\n';
            if (!r(presentOld, presentNew, 'present trace')) return;

            for (const required of [
              'ghost_color = can_transfer ? h_green : h_red;',
              'validate_container_transfer( source_item, destination_container',
              'inventory_modal_trace_sequence',
              'AIM redraw callback ENTER',
              'move modal adaptor destroyed',
              'split modal adaptor destroyed'
            ]) {
              if (!text.includes(required)) {
                core.setFailed(`required marker missing: ${required}`);
                return;
              }
            }

            const updated = await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              sha: file.data.sha,
              message: 'Add detailed inventory modal redraw tracing',
              content: Buffer.from(text, 'utf8').toString('base64')
            });
            core.info(`created commit ${updated.data.commit.sha}`);
