name: Apply vehicle install double click

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - '.github/workflows/apply_vehicle_install_double_click.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test

      - name: Patch existing install list click handling
        shell: bash
        run: |
          python3 -m py_compile .github/workflows/fix_vehicle_install_double_click.py
          python3 .github/workflows/fix_vehicle_install_double_click.py
          git diff --check
          grep -n "last_clicked_part" src/veh_interact.cpp
          grep -n "milliseconds( 500 )" src/veh_interact.cpp

      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/veh_interact.cpp
          git rm .github/workflows/apply_vehicle_install_double_click.yml
          git rm .github/workflows/fix_vehicle_install_double_click.py
          git commit -m "Allow double-click vehicle part install"
          git push origin HEAD:mouse-inventory-0-i-test
