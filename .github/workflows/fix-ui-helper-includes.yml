name: Fix UI helper includes
on:
  push:
    branches: [ mouse-inventory-0-i-test ]
    paths:
      - .github/workflows/fix-ui-helper-includes.py
      - .github/workflows/fix-ui-helper-includes.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1
      - name: Apply include cleanup
        run: python3 .github/workflows/fix-ui-helper-includes.py
      - name: Validate
        run: |
          git diff --check
          grep -n '#include "../primitive/overlay.h"' src/ui_helpers/controls/dropdown.h
          grep -n '#include "../models/scroll_model.h"' src/ui_helpers/primitive/scrollbar.h
          grep -n '#include "scrollbar.h"' src/ui_helpers/primitive/scrollbar.cpp
          grep -n '#include "../../output.h"' src/ui_helpers/primitive/scrollbar.cpp
      - name: Commit and push
        run: |
          git rm -f .github/workflows/fix-ui-helper-includes.py .github/workflows/fix-ui-helper-includes.yml
          git config user.name "Alexm-wq"
          git config user.email "alexme.travel@gmail.com"
          git add src/ui_helpers
          git diff --cached --check
          git commit -m "Make UI helper includes self-contained"
          git push origin HEAD:mouse-inventory-0-i-test
