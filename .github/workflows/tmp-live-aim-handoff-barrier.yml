name: Temporary live AIM handoff barrier

on:
  push:
    branches:
      - mouse-inventory-0-i-test

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary live AIM handoff patch worker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'mouse-inventory-0-i-test';

            async function patchFile(path, replacements) {
              const got = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              let text = Buffer.from(got.data.content, 'base64').toString('utf8');
              for (const [oldText, newText, label] of replacements) {
                const count = text.split(oldText).length - 1;
                if (count !== 1) {
                  core.setFailed(`${path}: ${label} match count = ${count}`);
                  return false;
                }
                text = text.replace(oldText, newText);
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch,
                message: path === 'src/advanced_inv.cpp'
                  ? 'Keep map live while suppressing AIM handoff flash'
                  : 'Allow temporary lower-UI redraw barriers',
                sha: got.data.sha,
                content: Buffer.from(text, 'utf8').toString('base64')
              });
              return true;
            }

            if (!await patchFile('src/ui_manager.h', [[
              '        void invalidate_ui() const;\n\n        /**\n         * Reset all callbacks and dimensions.',
              '        void invalidate_ui() const;\n\n        /** Temporarily control whether UIs below this adaptor may redraw. */\n        void set_disable_uis_below( bool disable );\n\n        /**\n         * Reset all callbacks and dimensions.',
              'ui_adaptor toggle declaration'
            ]])) return;

            if (!await patchFile('src/ui_manager.cpp', [[
              'void ui_adaptor::reset()\n{',
              'void ui_adaptor::set_disable_uis_below( const bool disable )\n{\n    if( disabling_uis_below == disable ) {\n        return;\n    }\n    disabling_uis_below = disable;\n    invalidation_consistency_and_optimization();\n}\n\nvoid ui_adaptor::reset()\n{',
              'ui_adaptor toggle implementation'
            ]])) return;

            if (!await patchFile('src/advanced_inv.cpp', [
              [
                '        // AIM is a full-screen modal workspace.  Keep lower game/map adaptors\n        // disabled for the complete workspace lifetime, including move-cost\n        // activity handoffs.  The simulation still advances normally; this only\n        // prevents the hidden world UI from being rendered between frozen and\n        // refreshed AIM frames.  Popups created after AIM remain enabled above it.\n        ui = std::make_unique<ui_adaptor>( ui_adaptor::disable_uis_below{} );',
                '        // Keep AIM and the main world UI active together.  A short-lived\n        // redraw barrier is enabled only for the first frame after an activity\n        // handoff, where exposing the lower UI caused the visible flash.\n        ui = std::make_unique<ui_adaptor>();',
                'restore normal AIM adaptor'
              ],
              [
                '            if( first_frame_after_handoff ) {\n                inventory_modal_trace( "display present releasing frozen handoff" );\n                activity_handoff = false;\n            }\n            inventory_modal_trace( "display present invalidating AIM adaptor" );\n            ui->invalidate_ui();',
                '            if( first_frame_after_handoff ) {\n                inventory_modal_trace( "display present releasing frozen handoff" );\n                activity_handoff = false;\n                ui->set_disable_uis_below( true );\n                inventory_modal_trace( "display present temporary lower-UI barrier ENABLED" );\n            }\n            inventory_modal_trace( "display present invalidating AIM adaptor" );\n            ui->invalidate_ui();',
                'enable one-frame handoff barrier'
              ],
              [
                '            ui_manager::redraw_invalidated();\n            inventory_modal_trace( "display present redraw_invalidated returned" );\n            if( first_frame_after_handoff ) {\n                first_frame_after_handoff = false;\n                log_workspace_event( "refreshed handoff frame without invalidating main UI" );\n                end_inventory_modal_trace( "first refreshed AIM frame after handoff completed" );\n            }',
                '            ui_manager::redraw_invalidated();\n            inventory_modal_trace( "display present redraw_invalidated returned" );\n            if( first_frame_after_handoff ) {\n                ui->set_disable_uis_below( false );\n                g->invalidate_main_ui_adaptor();\n                inventory_modal_trace( "display present temporary lower-UI barrier DISABLED; main/world queued for next joint redraw" );\n                first_frame_after_handoff = false;\n                log_workspace_event( "refreshed handoff frame without invalidating main UI" );\n                end_inventory_modal_trace( "first refreshed AIM frame after handoff completed" );\n            }',
                'release one-frame handoff barrier'
              ]
            ])) return;
