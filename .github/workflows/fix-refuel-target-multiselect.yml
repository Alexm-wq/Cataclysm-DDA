name: Fix refuel target multi-select

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - .github/workflows/fix-refuel-target-multiselect.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1

      - name: Apply refuel target multi-select patch
        run: |
          python3 -m py_compile .github/workflows/fix-refuel-target-multiselect.py
          python3 .github/workflows/fix-refuel-target-multiselect.py

      - name: Validate
        run: |
          git diff --check
          ! grep -q 'selected_tank_slot' src/veh_interact.cpp
          grep -q 'std::vector<bool> tank_selected' src/veh_interact.cpp
          grep -q '\[ Choose fuel sources \]' src/veh_interact.cpp
          grep -q 'Continue with this partial refuel?' src/veh_interact.cpp
          grep -q 'Projected result:' src/veh_interact.cpp
          grep -q 'Selected containers contain different fuel types and cannot be refueled together' src/veh_interact.cpp

      - name: Commit and clean worker
        run: |
          git config user.name 'Alexm-wq'
          git config user.email 'alexme.travel@gmail.com'
          git rm .github/workflows/fix-refuel-target-multiselect.py \
                 .github/workflows/fix-refuel-target-multiselect.yml
          git add src/veh_interact.cpp
          git commit -m 'Add multi-target vehicle refueling'
          git push origin HEAD:mouse-inventory-0-i-test
