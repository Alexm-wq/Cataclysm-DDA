name: Fix refuel live and Escape
on:
  push:
    branches: [ mouse-inventory-0-i-test ]
    paths:
      - .github/workflows/fix-refuel-live-esc.py
      - .github/workflows/fix-refuel-live-esc.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1
      - name: Apply fix
        run: python3 .github/workflows/fix-refuel-live-esc.py
      - name: Validate
        run: |
          git diff --check
          grep -n -A8 "if( refuel_info )" src/veh_interact.cpp | grep "display_live_preview( here );"
          grep -n "const bool mouse_action" src/veh_interact.cpp
          grep -n -A2 'action == "QUIT" && refuel_info' src/veh_interact.cpp | grep "close_refuel_mode"
      - name: Commit and push
        run: |
          git rm -f .github/workflows/fix-refuel-live-esc.py .github/workflows/fix-refuel-live-esc.yml
          git config user.name "Alexm-wq"
          git config user.email "alexme.travel@gmail.com"
          git add src/veh_interact.cpp
          git diff --cached --check
          git commit -m "Keep refuel live preview and fix Escape"
          git push origin HEAD:mouse-inventory-0-i-test
