name: Refactor UI helpers
on:
  push:
    branches: [ mouse-inventory-0-i-test ]
    paths:
      - .github/workflows/refactor-ui-helpers.py
      - .github/workflows/refactor-ui-helpers.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1
      - name: Apply refactor
        run: python3 .github/workflows/refactor-ui-helpers.py
      - name: Validate structure
        run: |
          git diff --check
          test -f src/ui_helpers/primitive/overlay.h
          test -f src/ui_helpers/primitive/scrollbar.h
          test -f src/ui_helpers/primitive/scrollbar.cpp
          test -f src/ui_helpers/controls/dropdown.h
          test -f src/ui_helpers/models/multiselect_filter.h
          test -f src/ui_helpers/models/scroll_model.h
          grep -n 'ui_helpers/primitive/scrollbar.h' src/output.h
          grep -n 'ui_helpers/controls/dropdown.h' src/veh_interact.h
          grep -n 'UI_HELPER_SOURCES' Makefile src/CMakeLists.txt
          grep -n 'ui_helpers\\primitive\\\*.cpp' msvc-full-features/Cataclysm-lib-vcpkg-static.vcxproj
          ! grep -n '^class scrollbar$' src/output.h
          ! grep -n 'scrollbar::scrollbar()' src/output.cpp
      - name: Commit and push
        run: |
          git rm -f .github/workflows/refactor-ui-helpers.py .github/workflows/refactor-ui-helpers.yml
          git config user.name "Alexm-wq"
          git config user.email "alexme.travel@gmail.com"
          git add src/ui_helpers src/output.h src/output.cpp src/veh_interact.h src/CMakeLists.txt Makefile msvc-full-features/Cataclysm-lib-vcpkg-static.vcxproj
          git diff --cached --check
          git commit -m "Extract reusable UI helper layers"
          git push origin HEAD:mouse-inventory-0-i-test
