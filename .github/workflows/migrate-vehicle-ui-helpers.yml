name: Migrate vehicle UI helpers
on:
  push:
    branches: [mouse-inventory-0-i-test]
    paths:
      - '.github/workflows/migrate-vehicle-ui-helpers.py'
      - '.github/workflows/migrate-vehicle-ui-helpers.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1
      - name: Apply migration
        run: python .github/workflows/migrate-vehicle-ui-helpers.py
      - name: Validate
        run: |
          git diff --check
          grep -q 'ui_action_strip editor_toolbar_strip' src/veh_interact.h
          grep -q 'ui_double_click_tracker' src/veh_interact.h
      - name: Commit and push
        run: |
          git config user.name 'Alexm-wq'
          git config user.email 'alexme.travel@gmail.com'
          git add -A
          git rm -f .github/workflows/migrate-vehicle-ui-helpers.py .github/workflows/migrate-vehicle-ui-helpers.yml
          git commit -m 'Migrate vehicle editor to reusable UI helpers'
          git push origin HEAD:mouse-inventory-0-i-test
