name: Repair infection PNG asset

on:
  push:
    branches: [ mouse-inventory-0-i-test ]
    paths: [ .github/workflows/repair-infection-png.yml ]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1
      - name: Rebuild exact binary PNG
        shell: bash
        run: |
          cat .github/repair/atlas.part0 .github/repair/atlas.part1 .github/repair/atlas.part2 .github/repair/atlas.part3 .github/repair/atlas.part4 | base64 --decode > data/json/monsters/bioluminescent_infection_test_large_atlas.png
          test "$(git hash-object data/json/monsters/bioluminescent_infection_test_large_atlas.png)" = "bd46421d3ecd38cabb677edc36de540954340e00"
          python3 - <<'PY'
          from pathlib import Path
          d = Path('data/json/monsters/bioluminescent_infection_test_large_atlas.png').read_bytes()
          assert d[:8] == b'\x89PNG\r\n\x1a\n'
          assert int.from_bytes(d[16:20], 'big') == 256
          assert int.from_bytes(d[20:24], 'big') == 64
          PY
      - name: Commit repaired asset
        shell: bash
        run: |
          rm -f .github/workflows/repair-infection-png.yml .github/repair/atlas.part*
          rmdir .github/repair 2>/dev/null || true
          git config user.name "Alexm-wq"
          git config user.email "alexme.travel@gmail.com"
          git add -A
          git commit -m "Repair infection PNG binary encoding [skip ci]"
          git push origin HEAD:mouse-inventory-0-i-test
