name: Fix SDL mouse motion input
on:
  push:
    branches: [ mouse-inventory-0-i-test ]
    paths:
      - .github/workflows/fix-sdl-mouse-motion-input.py
      - .github/workflows/fix-sdl-mouse-motion-input.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1
      - name: Apply fix
        run: python3 .github/workflows/fix-sdl-mouse-motion-input.py
      - name: Validate
        run: |
          git diff --check
          grep -n -A3 "Mouse motion is advisory/hover input" src/sdltiles.cpp
          grep -n "last_input.type == input_event_t::error" src/sdltiles.cpp
      - name: Commit and push
        run: |
          git rm -f .github/workflows/fix-sdl-mouse-motion-input.py .github/workflows/fix-sdl-mouse-motion-input.yml
          git config user.name "Alexm-wq"
          git config user.email "alexme.travel@gmail.com"
          git add src/sdltiles.cpp
          git diff --cached --check
          git commit -m "Preserve keyboard input during mouse motion"
          git push origin HEAD:mouse-inventory-0-i-test
