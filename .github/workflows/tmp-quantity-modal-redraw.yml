name: Temporary quantity modal redraw patch

on:
  push:
    branches:
      - mouse-inventory-0-i-test

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1
      - name: Patch quantity popup redraw
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/advanced_inv.cpp')
          text = path.read_text()

          function_marker = 'bool advanced_inventory::query_charges('
          function_pos = text.find(function_marker)
          if function_pos < 0:
              raise SystemExit('query_charges not found')
          brace_pos = text.find('{\n', function_pos)
          if brace_pos < 0:
              raise SystemExit('query_charges opening brace not found')
          insert_pos = brace_pos + 2

          guard = '''    // Quantity dialogs own temporary UI objects.  Their destruction invalidates
              // the inventory underneath, so service that invalidation before returning
              // to the drag/move caller instead of exposing a stale Tiles frame.
              bool quantity_popup_opened = false;
              on_out_of_scope restore_after_quantity_popup( [&]() {
                  if( quantity_popup_opened && ui ) {
                      ui_manager::redraw_invalidated();
                  }
              } );
          '''
          text = text[:insert_pos] + guard + text[insert_pos:]

          status_marker = 'set_workspace_status( popupmsg );'
          status_pos = text.find(status_marker, insert_pos)
          if status_pos < 0:
              raise SystemExit('quantity popup status marker not found')
          line_start = text.rfind('\n', insert_pos, status_pos) + 1
          indent = text[line_start:status_pos]
          text = text[:line_start] + indent + 'quantity_popup_opened = true;\n' + text[line_start:]

          path.write_text(text)
          PY

          rm -f .tmp_quantity_modal_active_trigger
          rm -f .github/workflows/tmp-quantity-modal-redraw.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore inventory after quantity popup"
          git push origin HEAD:mouse-inventory-0-i-test
