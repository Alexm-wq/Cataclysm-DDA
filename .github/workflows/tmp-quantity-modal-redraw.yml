name: Temporary quantity modal redraw patch

on:
  push:
    branches:
      - mouse-inventory-0-i-test

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1
      - name: Patch quantity popup redraw
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/advanced_inv.cpp')
          text = path.read_text()

          function_start = '''bool advanced_inventory::query_charges( aim_location destarea, const advanced_inv_listitem &sitem,
                                          const std::string &action, int &amount,
                                          const item_location &destination_container )
          {
          '''
          function_replacement = function_start + '''    // Quantity dialogs own temporary UI objects.  Their destruction invalidates
              // the inventory underneath, so service that invalidation before returning
              // to the drag/move caller instead of exposing a stale Tiles frame.
              bool quantity_popup_opened = false;
              on_out_of_scope restore_after_quantity_popup( [&]() {
                  if( quantity_popup_opened && ui ) {
                      ui_manager::redraw_invalidated();
                  }
              } );
          '''
          if function_start not in text:
              raise SystemExit('query_charges header not found')
          text = text.replace(function_start, function_replacement, 1)

          popup_start = '''        } else {
                      set_workspace_status( popupmsg );
                      if( ui ) {
                          ui_manager::redraw();
                      }
          '''
          popup_replacement = '''        } else {
                      quantity_popup_opened = true;
                      set_workspace_status( popupmsg );
                      if( ui ) {
                          ui_manager::redraw();
                      }
          '''
          if popup_start not in text:
              raise SystemExit('quantity popup branch not found')
          text = text.replace(popup_start, popup_replacement, 1)
          path.write_text(text)
          PY

          rm -f .tmp_quantity_modal_active_trigger
          rm -f .github/workflows/tmp-quantity-modal-redraw.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/advanced_inv.cpp .github/workflows/tmp-quantity-modal-redraw.yml .tmp_quantity_modal_active_trigger
          git commit -m "Restore inventory after quantity popup"
          git push origin HEAD:mouse-inventory-0-i-test
