name: Temporary split recalc patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'tmp-split-flicker-recalc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-split-flicker-recalc
      - name: Apply patch
        shell: bash
        run: |
          python3 .github/tmp_split_recalc_patch.py
          git diff --check
          git config user.name "Inventory Fix Worker"
          git config user.email "inventory-fix@users.noreply.github.com"
          git add src/advanced_inv.cpp
          git commit -m "Rebuild inventory before releasing split modal"
          git push origin HEAD:tmp-split-flicker-recalc
