name: Fix live preview gameplay zoom

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - .github/workflows/fix-live-preview-gameplay-zoom.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1
          sparse-checkout: |
            src/veh_interact.cpp
            .github/workflows/fix-live-preview-gameplay-zoom.yml
          sparse-checkout-cone-mode: false

      - name: Match gameplay mouse zoom math
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/veh_interact.cpp")
          text = path.read_text()

          start_marker = (
              '        if( over_live_preview ) {\n'
              '            // Live preview deliberately has the same finite editor range and\n'
          )
          end_marker = '        if( over_schematic_content ) {'

          if text.count(start_marker) != 1:
              raise SystemExit(f"expected one old live preview zoom block, found {text.count(start_marker)}")
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          lines = [
              '        if( over_live_preview ) {',
              '            // Keep Live/Split zoom on the same finite editor range, but mirror',
              '            // normal gameplay mouse-wheel camera behavior: zoom-in is cursor',
              '            // anchored and zoom-out remains centered on the current camera.',
              '            // Pane routing above has already selected the live preview; keep all',
              '            // camera math local to that routed pane.',
              '#if defined(TILES)',
              '            catacurses::window &preview = active_editor_view_mode == editor_view_mode::live ?',
              '                                          w_live_preview_full : w_live_preview_split;',
              '            const int old_zoom = live_preview_zoom;',
              '            const int new_zoom = std::clamp( live_preview_zoom - direction, 1, 3 );',
              '',
              '            std::optional<tripoint_bub_ms> zoom_anchor;',
              '            const tripoint_bub_ms old_center = live_preview_vehicle_center( here ) +',
              '                    tripoint_rel_ms( point_rel_ms( live_preview_pan ), 0 );',
              '            if( action == "SCROLL_UP" && new_zoom > old_zoom && live_preview_pos ) {',
              '                zoom_anchor = map_preview_cell_to_map( preview, *live_preview_pos, old_center,',
              '                                                       old_zoom * 8 );',
              '            }',
              '',
              '            live_preview_zoom = new_zoom;',
              '            if( zoom_anchor && new_zoom > old_zoom ) {',
              '                // Same camera correction as game::handle_action mouse-wheel zoom-in:',
              '                // move toward the old cursor anchor by (1 - old/new) of the',
              '                // old center-to-anchor vector.  The 8x renderer scale cancels',
              '                // from the ratio, so the editor zoom levels can be used directly.',
              '                const double camera_fraction = 1.0 - static_cast<double>( old_zoom ) /',
              '                                               static_cast<double>( new_zoom );',
              '                live_preview_pan.x += static_cast<int>( std::lround(',
              '                                          ( zoom_anchor->x() - old_center.x() ) * camera_fraction ) );',
              '                live_preview_pan.y += static_cast<int>( std::lround(',
              '                                          ( zoom_anchor->y() - old_center.y() ) * camera_fraction ) );',
              '            }',
              '#else',
              '            live_preview_zoom = std::clamp( live_preview_zoom - direction, 1, 3 );',
              '#endif',
              '            return true;',
              '        }',
          ]
          replacement = '\n'.join(lines) + '\n'
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Sanity checks
        shell: bash
        run: |
          git diff --check
          grep -F 'const double camera_fraction = 1.0 - static_cast<double>( old_zoom ) /' src/veh_interact.cpp
          grep -F 'if( action == "SCROLL_UP" && new_zoom > old_zoom && live_preview_pos ) {' src/veh_interact.cpp
          grep -F 'const bool over_live_preview = viewport_pos && point_in_live_preview( *viewport_pos );' src/veh_interact.cpp
          grep -F 'if( install_info && list_pos ) {' src/veh_interact.cpp
          ! grep -F 'const std::optional<tripoint_bub_ms> before = map_preview_cell_to_map' src/veh_interact.cpp
          ! grep -F 'const std::optional<tripoint_bub_ms> after = map_preview_cell_to_map' src/veh_interact.cpp

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/fix-live-preview-gameplay-zoom.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/veh_interact.cpp .github/workflows/fix-live-preview-gameplay-zoom.yml
          git commit -m 'Match live vehicle preview zoom to gameplay'
          git push origin HEAD:mouse-inventory-0-i-test
