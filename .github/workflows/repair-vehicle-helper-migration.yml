name: Repair vehicle helper migration script
on:
  push:
    branches: [mouse-inventory-0-i-test]
    paths:
      - '.github/workflows/repair-vehicle-helper-migration.py'
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1
      - run: python .github/workflows/repair-vehicle-helper-migration.py
      - run: |
          git config user.name 'Alexm-wq'
          git config user.email 'alexme.travel@gmail.com'
          git rm -f .github/workflows/repair-vehicle-helper-migration.py .github/workflows/repair-vehicle-helper-migration.yml
          git add .github/workflows/apply-vehicle-helper-migration.py
          git commit -m 'Repair vehicle helper migration guard'
          git push origin HEAD:mouse-inventory-0-i-test
