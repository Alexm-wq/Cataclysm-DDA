name: Fix vehicle context menu switching

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - .github/workflows/fix-vehicle-context-menu-switch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1

      - name: Apply context menu ordering fix
        run: |
          python3 .github/workflows/fix-vehicle-context-menu-switch.py

      - name: Validate
        run: |
          git diff --check
          grep -q 'Do not pre-close an existing context menu here' src/veh_interact.cpp
          grep -q 'open_editor_context_menu()' src/veh_interact.cpp

      - name: Commit and clean worker
        run: |
          git config user.name 'Alexm-wq'
          git config user.email 'alexme.travel@gmail.com'
          git rm .github/workflows/fix-vehicle-context-menu-switch.py \
                 .github/workflows/fix-vehicle-context-menu-switch.yml
          git add src/veh_interact.cpp
          git commit -m 'Fix vehicle context menu switching'
          git push origin HEAD:mouse-inventory-0-i-test
