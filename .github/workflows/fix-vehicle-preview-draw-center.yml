name: Fix vehicle preview draw center

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - .github/workflows/fix-vehicle-preview-draw-center.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test

      - name: Apply preview draw-center fix
        shell: bash
        run: |
          python3 -m py_compile .github/scripts/fix_vehicle_preview_draw_center.py
          python3 .github/scripts/fix_vehicle_preview_draw_center.py

      - name: Sanity checks
        shell: bash
        run: |
          git diff --check
          grep -F 'const tripoint_bub_ms logical_tile_draw_center' src/sdltiles.cpp
          grep -F 'POSX - preview_half_tiles.x' src/sdltiles.cpp
          grep -F 'POSY - preview_half_tiles.y' src/sdltiles.cpp
          grep -F '[VEH_LIVE_RENDER] draw logical_center=(' src/sdltiles.cpp
          grep -F 'draw_tiles->draw( tile_draw_pos, tile_draw_center' src/sdltiles.cpp

      - name: Commit fix and remove helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sdltiles.cpp
          git rm .github/scripts/fix_vehicle_preview_draw_center.py
          git rm .github/workflows/fix-vehicle-preview-draw-center.yml
          git commit -m 'Center live vehicle preview on its viewport'
          git push origin HEAD:mouse-inventory-0-i-test
