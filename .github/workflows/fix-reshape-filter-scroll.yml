name: Fix reshape variant filter and scroll

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - .github/workflows/fix-reshape-filter-scroll.py
      - .github/workflows/fix-reshape-filter-scroll.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1

      - name: Apply reshape filter and scroll fix
        run: python3 .github/workflows/fix-reshape-filter-scroll.py

      - name: Validate
        run: |
          git diff --check
          grep -n "reshape_part_has_visible_variants" src/veh_interact.cpp
          grep -n "has_vehicle_part_preview_tile( vpi.id.str(), variant_id )" src/veh_interact.cpp
          ! grep -n "variant_scroll = reshape_info->variant_pos - visible + 1" src/veh_interact.cpp

      - name: Commit and push
        run: |
          git rm .github/workflows/fix-reshape-filter-scroll.py .github/workflows/fix-reshape-filter-scroll.yml
          git config user.name "Alexm-wq"
          git config user.email "alexme.travel@gmail.com"
          git add src/veh_interact.cpp
          git diff --cached --check
          git commit -m "Filter reshape variants by tileset and free scrolling"
          git push origin HEAD:mouse-inventory-0-i-test
