name: Finalize vehicle helper migration
on:
  push:
    branches: [mouse-inventory-0-i-test]
    paths:
      - '.github/workflows/run-vehicle-helper-migration.yml'
jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1
      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/veh_interact.cpp')
          s = p.read_text()
          old = 'if( action == "MOUSE_MOVE" || mode_pos || editor_toolbar_hover_button >= 0 ) {'
          new = 'if( action == "MOUSE_MOVE" || mode_pos || editor_toolbar_strip.hovered_index() >= 0 ) {'
          if s.count(old) != 1:
              raise SystemExit(f'stale toolbar hover reference count: {s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''void veh_interact::close_refuel_mode()\n{\n    refuel_info.reset();\n    msg.reset();\n}'''
          new = '''void veh_interact::close_refuel_mode()\n{\n    refuel_info.reset();\n    refuel_overlay.close();\n    msg.reset();\n}'''
          if s.count(old) != 1:
              raise SystemExit('close_refuel_mode shape mismatch')
          s = s.replace(old, new, 1)

          old = '''    reshape_info.reset();\n    refuel_info.reset();\n    refill_target = item_location();'''
          new = '''    reshape_info.reset();\n    refuel_info.reset();\n    refuel_overlay.close();\n    refill_target = item_location();'''
          if s.count(old) != 1:
              raise SystemExit('activity refuel teardown shape mismatch')
          s = s.replace(old, new, 1)

          s = s.replace('behind the compact refuel modal.  w_refuel_overlay is already a\n                // dedicated small window, so draw/register the preview first and',
                        'behind the compact refuel modal.  refuel_overlay owns a dedicated\n                // small window, so draw/register the preview first and')
          p.write_text(s)
          PY
      - name: Validate helper migration
        run: |
          git diff --check
          ! grep -R 'editor_toolbar_hover_button' src/veh_interact.cpp src/veh_interact.h
          ! grep -R 'struct editor_context_button\|struct editor_toolbar_button' src/veh_interact.h
          ! grep -R 'last_clicked_part\|last_clicked_variant\|last_clicked_tank_index\|last_clicked_source_index' src/veh_interact.cpp
          ! grep -R 'last_tank_click_time\|last_source_click_time' src/veh_interact.cpp
          grep -q 'refuel_overlay.close();' src/veh_interact.cpp
          grep -q 'editor_toolbar_strip.hovered_index() >= 0' src/veh_interact.cpp
      - name: Commit source fix
        run: |
          git config user.name 'Alexm-wq'
          git config user.email 'alexme.travel@gmail.com'
          git add src/veh_interact.cpp
          git commit -m 'Finalize vehicle UI helper migration'
          git push origin HEAD:mouse-inventory-0-i-test
