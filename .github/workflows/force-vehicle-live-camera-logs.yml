name: Force vehicle live camera logs

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - .github/workflows/force-vehicle-live-camera-logs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1
          sparse-checkout: |
            src/veh_interact.cpp
            src/sdltiles.cpp
            .github/scripts/force_vehicle_live_camera_logs.py
            .github/workflows/force-vehicle-live-camera-logs.yml
          sparse-checkout-cone-mode: false

      - name: Promote tagged diagnostics
        run: python3 .github/scripts/force_vehicle_live_camera_logs.py

      - name: Sanity checks
        shell: bash
        run: |
          git diff --check
          grep -F '[VEH_LIVE_CAMERA]' src/veh_interact.cpp
          grep -F '[VEH_LIVE_RENDER]' src/sdltiles.cpp
          grep -F 'DebugLog( D_INFO, D_MAIN )' src/veh_interact.cpp
          grep -F 'DebugLog( D_INFO, D_MAIN )' src/sdltiles.cpp

      - name: Commit diagnostics and clean helpers
        shell: bash
        run: |
          rm .github/scripts/force_vehicle_live_camera_logs.py
          rm .github/workflows/force-vehicle-live-camera-logs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/veh_interact.cpp src/sdltiles.cpp .github/scripts/force_vehicle_live_camera_logs.py .github/workflows/force-vehicle-live-camera-logs.yml
          git commit -m 'Make vehicle live camera diagnostics visible'
          git push origin HEAD:mouse-inventory-0-i-test
