name: Temporary inventory modal lifecycle patch

on:
  push:
    branches:
      - mouse-inventory-0-i-test

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary inventory modal lifecycle patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'mouse-inventory-0-i-test';
            const path = 'src/advanced_inv.cpp';

            const file = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            let text = Buffer.from(file.data.content, 'base64').toString('utf8');

            const countOf = (haystack, needle) => haystack.split(needle).length - 1;
            const replaceExact = (needle, replacement, expected, label) => {
              const count = countOf(text, needle);
              if (count !== expected) {
                core.setFailed(`${label}: expected ${expected} match(es), found ${count}`);
                return false;
              }
              text = text.split(needle).join(replacement);
              return true;
            };

            // These guards were added after the known-good backup branch.  Destroying
            // disable_uis_below invalidates AIM, and finish_quantity_modal immediately
            // services that invalidation, which presents a full inventory redraw between
            // quantity-popup teardown and the normal move/activity handoff.
            const quantityGuard = `    // Keep the last complete inventory frame blocked while the quantity modal\n` +
              `    // exists and until the resulting move has either armed activity_handoff or\n` +
              `    // returned without changing the workspace.  This mirrors Split Stack's\n` +
              `    // outer modal guard and prevents popup teardown from exposing a transient frame.\n` +
              `    // Declare this before the blocker so destruction runs in the required order:\n` +
              `    // modal/blocker first, then one AIM redraw after activity_handoff is armed.\n` +
              `    std::unique_ptr<on_out_of_scope> finish_quantity_modal;\n` +
              `    if( !test_mode && ui ) {\n` +
              `        finish_quantity_modal = std::make_unique<on_out_of_scope>( [&]() {\n` +
              `            ui_manager::redraw_invalidated();\n` +
              `        } );\n` +
              `    }\n` +
              `    std::unique_ptr<ui_adaptor> quantity_modal_guard;\n` +
              `    if( !test_mode ) {\n` +
              `        quantity_modal_guard = std::make_unique<ui_adaptor>( ui_adaptor::disable_uis_below{} );\n` +
              `    }\n`;
            if (!replaceExact(quantityGuard, '', 2, 'quantity move guard')) return;

            // Restore Split Stack's modal boundary to the known-good pre-tile-context
            // behavior: establish the complete AIM frame before opening the modal, but do
            // not block/re-enable AIM or force a redraw when the popup closes.
            const splitGuard = `    // Keep the inventory frame blocked until the split mutation and pane-recalc\n` +
              `    // flags are complete.  Otherwise closing the amount popup can briefly expose\n` +
              `    // the pre-split frame before the new stack state is ready.\n` +
              `    std::unique_ptr<ui_adaptor> split_recalc_guard;\n` +
              `    if( !test_mode ) {\n` +
              `        split_recalc_guard = std::make_unique<ui_adaptor>( ui_adaptor::disable_uis_below{} );\n` +
              `    }\n` +
              `    const auto release_split_recalc_guard = [&]() {\n` +
              `        split_recalc_guard.reset();\n` +
              `    };\n`;
            const splitPrelude = `    if( ui ) {\n` +
              `        ui_manager::redraw();\n` +
              `    }\n`;
            if (!replaceExact(splitGuard, splitPrelude, 1, 'split modal guard')) return;

            const releasePattern = /^[ \t]*release_split_recalc_guard\(\);\r?\n/gm;
            const releases = text.match(releasePattern) || [];
            if (releases.length !== 6) {
              core.setFailed(`split guard release calls: expected 6, found ${releases.length}`);
              return;
            }
            text = text.replace(releasePattern, '');

            // Do not explicitly redraw AIM after Split Stack returns.  The normal input
            // loop owns presentation of the post-split state, as on the working backup.
            const splitDispatch = `    } else if( action == \"SPLIT_SELECTED\" ) {\n` +
              `        const bool split_exit = action_split_stack( sitem, spane );\n` +
              `        // The split popup is destroyed inside action_split_stack(), which invalidates the\n` +
              `        // inventory beneath it.  In Tiles, returning to the outer input loop before\n` +
              `        // servicing that invalidation can present one frame with the popup gone and the\n` +
              `        // workspace not yet restored.  Finish that UI-manager redraw in the same input\n` +
              `        // dispatch so the final split state and status appear atomically.\n` +
              `        if( ui ) {\n` +
              `            ui_manager::redraw_invalidated();\n` +
              `        }\n` +
              `        return split_exit;\n`;
            const splitDispatchGood = `    } else if( action == \"SPLIT_SELECTED\" ) {\n` +
              `        return action_split_stack( sitem, spane );\n`;
            if (!replaceExact(splitDispatch, splitDispatchGood, 1, 'split dispatch redraw')) return;

            // Fail closed if any of the experimental modal lifecycle state remains.
            for (const forbidden of [
              'finish_quantity_modal',
              'quantity_modal_guard',
              'split_recalc_guard',
              'release_split_recalc_guard'
            ]) {
              if (text.includes(forbidden)) {
                core.setFailed(`leftover modal lifecycle symbol: ${forbidden}`);
                return;
              }
            }

            // Guard the unrelated drag/drop UX the user explicitly wants preserved.
            for (const required of [
              'ghost_color = can_transfer ? h_green : h_red;',
              'preview_batch_transfer( *mouse_drag_side, hovered, AIM_CONTAINER, drop_target );',
              'dragged_item->stacks_with_ignoring_separate_stack( *drop_target )',
              'validate_container_transfer( source_item, destination_container )'
            ]) {
              if (!text.includes(required)) {
                core.setFailed(`unrelated inventory behavior unexpectedly missing: ${required}`);
                return;
              }
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              sha: file.data.sha,
              message: 'Fix inventory quantity modal flicker',
              content: Buffer.from(text, 'utf8').toString('base64')
            });