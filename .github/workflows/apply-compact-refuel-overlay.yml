name: Apply compact vehicle refuel overlay

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - .github/workflows/apply-compact-refuel-overlay.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1

      - name: Apply compact staged refuel implementation
        run: |
          python3 -m py_compile .github/workflows/apply-compact-refuel-overlay.py
          python3 .github/workflows/apply-compact-refuel-overlay.py

      - name: Validate source patch
        run: |
          git diff --check
          grep -q 'enum class stage_t' src/veh_interact.cpp
          grep -q 'Ctrl+click = toggle' src/veh_interact.cpp
          grep -q 'engine_info->fuel_opts' src/veh_interact.cpp
          grep -q 'Test: add filled fuel containers to cargo' src/veh_interact.cpp
          grep -q 'time_duration::from_turns' src/veh_interact.cpp
          grep -q 'approximately 97% complete' doc/UI_MODERNIZATION_STATUS/VEHICLE_EDITOR_OVERHAUL_STATUS.md
          ! grep -q 'w_refuel_tanks' src/veh_interact.cpp
          ! grep -q 'w_refuel_sources' src/veh_interact.cpp
          ! grep -q 'w_refuel_details' src/veh_interact.cpp

      - name: Commit implementation and remove patch scaffolding
        run: |
          git config user.name 'Alexm-wq'
          git config user.email 'alexme.travel@gmail.com'
          git rm .github/workflows/apply-compact-refuel-overlay.py \
                 .github/workflows/apply-compact-refuel-overlay.yml
          git add src/veh_interact.cpp src/veh_interact.h doc/UI_MODERNIZATION_STATUS/VEHICLE_EDITOR_OVERHAUL_STATUS.md
          git commit -m 'Compact vehicle refuel workflow'
          git push origin mouse-inventory-0-i-test
