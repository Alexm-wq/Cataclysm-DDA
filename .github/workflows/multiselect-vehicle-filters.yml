name: Vehicle filter multiselect
on:
  push:
    branches: [ mouse-inventory-0-i-test ]
    paths:
      - .github/workflows/multiselect-vehicle-filters.py
      - .github/workflows/multiselect-vehicle-filters.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1
      - name: Apply patch
        run: python3 .github/workflows/multiselect-vehicle-filters.py
      - name: Validate
        run: |
          git diff --check
          grep -n 'std::set<editor_system_filter> active_system_filters' src/veh_interact.h
          grep -n 'std::set<editor_condition_filter> active_condition_filters' src/veh_interact.h
          grep -n 'entry.label = string_format( checked ? "\[x\] %s" : "\[ \] %s"' src/veh_interact.cpp
          grep -n 'toggle_editor_filter( open_editor_dropdown, \*option )' src/veh_interact.cpp
          grep -n 'active_system_filters.clear()' src/veh_interact.cpp
          grep -n 'active_condition_filters.clear()' src/veh_interact.cpp
          ! grep -n 'active_system_filter[^s]' src/veh_interact.cpp src/veh_interact.h
          ! grep -n 'active_condition_filter[^s]' src/veh_interact.cpp src/veh_interact.h
      - name: Commit and push
        run: |
          git rm -f .github/workflows/multiselect-vehicle-filters.py .github/workflows/multiselect-vehicle-filters.yml
          git config user.name "Alexm-wq"
          git config user.email "alexme.travel@gmail.com"
          git add src/veh_interact.cpp src/veh_interact.h
          git diff --cached --check
          git commit -m "Add multi-select vehicle filters"
          git push origin HEAD:mouse-inventory-0-i-test
