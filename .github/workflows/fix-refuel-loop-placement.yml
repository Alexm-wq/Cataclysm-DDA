name: Fix compact refuel loop placement

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - .github/workflows/fix-refuel-loop-placement.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1

      - name: Restore UI adaptor and main-loop structure
        run: |
          python3 -m py_compile .github/workflows/fix-refuel-loop-placement.py
          python3 .github/workflows/fix-refuel-loop-placement.py

      - name: Validate structural fix
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/veh_interact.cpp').read_text()
          a = s.index('shared_ptr_fast<ui_adaptor> veh_interact::create_or_get_ui_adaptor')
          b = s.index('void veh_interact::do_main_loop', a)
          c = s.index('void veh_interact::cache_tool_availability', b)
          redraw = s[a:b]
          loop = s[b:c]
          assert 'continue;' not in redraw
          assert 'action ==' not in redraw
          assert 'while( !finish )' in loop
          assert 'using refuel_stage = refuel_info_t::stage_t;' in loop
          assert s.count('void veh_interact::do_main_loop( map &here )') == 1
          PY

      - name: Commit fix and remove scaffolding
        run: |
          git config user.name 'Alexm-wq'
          git config user.email 'alexme.travel@gmail.com'
          git rm .github/workflows/fix-refuel-loop-placement.py \
                 .github/workflows/fix-refuel-loop-placement.yml
          git add src/veh_interact.cpp
          git commit -m 'Fix compact refuel main-loop placement'
          git push origin mouse-inventory-0-i-test
