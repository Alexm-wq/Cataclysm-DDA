name: Apply vehicle warning and selection fix

on:
  push:
    branches:
      - mouse-inventory-0-i-test
    paths:
      - .github/workflows/apply-vehicle-warning-selection-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mouse-inventory-0-i-test
          fetch-depth: 1

      - name: Apply warning and selection patch
        run: |
          python3 -m py_compile .github/workflows/apply-vehicle-warning-selection-fix.py
          python3 .github/workflows/apply-vehicle-warning-selection-fix.py

      - name: Validate source patch
        run: |
          git diff --check
          grep -q 'suspend_persistent_editor_for_query' src/veh_interact.h
          grep -q 'restore_persistent_editor_after_query' src/veh_interact.cpp
          grep -q 'restore_vehicle_editor_after_query' src/game.cpp
          grep -q 'hilite( c_white )' src/veh_interact.cpp
          grep -q 'Game-level distraction warnings temporarily suspend' doc/UI_MODERNIZATION_STATUS/VEHICLE_EDITOR_OVERHAUL_STATUS.md

      - name: Commit implementation and remove temporary worker
        run: |
          git config user.name 'Alexm-wq'
          git config user.email 'alexme.travel@gmail.com'
          git rm .github/workflows/apply-vehicle-warning-selection-fix.py \
                 .github/workflows/apply-vehicle-warning-selection-fix.yml
          git add src/veh_interact.cpp \
                  src/veh_interact.h \
                  src/game.cpp \
                  doc/UI_MODERNIZATION_STATUS/VEHICLE_EDITOR_OVERHAUL_STATUS.md
          git commit -m 'Restore vehicle warning modal behavior'
          git push origin HEAD:mouse-inventory-0-i-test
